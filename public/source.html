<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source page — Liberty County Building Dept</title>
<!--
  Opens one page of a reference document and highlights the passage an answer
  was drawn from. A citation should land the reader on the sentence, not on
  page 1 of a 120-page code with a search box.

  /source.html?doc=/docs/land-development-code.pdf&page=114&q=Lots+shall+front
-->
<style>
  :root {
    /* county document standard — same tokens as the assistant */
    --maroon: #751D2C; --maroon-deep: #5E1723; --gold: #C1B572;
    --tint: #F6F3E7; --bg: #FAF8F2; --ink: #231F20; --muted: #6B6258; --grid: #D3C9A2;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Aptos, Calibri, "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header {
    background: var(--maroon); color: #fff; padding: 10px 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-bottom: 3px solid var(--gold);
  }
  header .title { font-weight: 800; font-size: 15px; }
  header .meta { font-size: 13px; color: var(--tint); }
  header .spacer { flex: 1; }
  .btn {
    background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35);
    padding: 6px 13px; border-radius: 5px; font: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,.26); }
  .btn[disabled] { opacity: .45; cursor: default; }
  main { flex: 1; overflow: auto; padding: 18px; display: flex; justify-content: center; }
  .sheet { position: relative; box-shadow: 0 6px 24px rgba(35,31,32,.18); background: #fff; }
  canvas { display: block; }
  .hl {
    position: absolute; background: rgba(193,181,114,.45);
    outline: 2px solid var(--maroon); border-radius: 2px;
    pointer-events: none; mix-blend-mode: multiply;
  }
  .status { padding: 30px; color: var(--muted); font-size: 15px; text-align: center; }
  .note {
    background: var(--tint); color: var(--ink); font-size: 13px;
    padding: 7px 16px; border-bottom: 1px solid var(--grid);
  }
</style>
</head>
<body>
<header>
  <span class="title" id="docName">Source</span>
  <span class="meta" id="pageMeta"></span>
  <span class="spacer"></span>
  <button class="btn" id="prev">&#8592; Page</button>
  <button class="btn" id="next">Page &#8594;</button>
  <a class="btn" id="raw" href="#" target="_blank" rel="noopener">Open the full PDF</a>
</header>
<div class="note" id="note" hidden></div>
<main><div id="stage" class="status">Loading the page&hellip;</div></main>

<script type="module">
import * as pdfjs from '/vendor/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.mjs';

const params = new URLSearchParams(location.search);
const url = params.get('doc');
const wanted = Math.max(1, parseInt(params.get('page') || '1', 10));
const phrase = (params.get('q') || '').trim();
const label = params.get('label') || '';

const stage = document.getElementById('stage');
const docName = document.getElementById('docName');
const pageMeta = document.getElementById('pageMeta');
const note = document.getElementById('note');
document.getElementById('raw').href = url ? url + '#page=' + wanted : '#';
docName.textContent = label || (url || '').split('/').pop() || 'Source';

if (!url || !url.startsWith('/docs/')) {
  stage.textContent = 'No document was given to open.';
  throw new Error('missing doc');
}

const norm = (s) => s.toLowerCase().replace(/[‘’“”]/g, "'").replace(/[^a-z0-9']+/g, ' ').trim();

let pdf, current = wanted;

async function render(pageNo) {
  const page = await pdf.getPage(pageNo);
  const fit = Math.min(1100, (window.innerWidth - 60)) / page.getViewport({ scale: 1 }).width;
  const viewport = page.getViewport({ scale: Math.min(2, Math.max(0.8, fit)) });

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(viewport.width);
  canvas.height = Math.floor(viewport.height);
  sheet.appendChild(canvas);
  document.querySelector('main').replaceChildren(sheet);

  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  pageMeta.textContent = `page ${pageNo} of ${pdf.numPages}`;
  document.getElementById('raw').href = url + '#page=' + pageNo;
  document.getElementById('prev').disabled = pageNo <= 1;
  document.getElementById('next').disabled = pageNo >= pdf.numPages;

  if (phrase) highlight(page, viewport, sheet);
  return sheet;
}

// Walk the page's text items and box the run that matches the cited phrase.
// Matching is done on normalised text because a PDF breaks a sentence into
// arbitrary pieces — "Lots shall front on a" / "street for at least 60'".
async function highlight(page, viewport, sheet) {
  const content = await page.getTextContent();
  const items = content.items.filter(i => i.str && i.str.trim());
  const target = norm(phrase);
  if (!target) return;

  const words = target.split(' ');
  // try the whole phrase, then progressively shorter leading fragments, so a
  // citation still lands even if the page breaks mid-sentence
  for (let take = words.length; take >= 3; take--) {
    const probe = words.slice(0, take).join(' ');
    const hits = findRun(items, probe);
    if (hits.length) {
      hits.forEach(i => box(i, viewport, sheet));
      sheet.querySelector('.hl')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      return;
    }
  }
  note.hidden = false;
  note.textContent = 'Opened at the cited page. The exact sentence could not be located to highlight — it may run across a page break.';
}

function findRun(items, probe) {
  for (let start = 0; start < items.length; start++) {
    let combined = '';
    for (let j = start; j < Math.min(items.length, start + 60); j++) {
      combined = norm(combined + ' ' + items[j].str);
      if (combined.includes(probe)) return trim(items, start, j, probe);
      if (combined.length > probe.length + 400) break;
    }
  }
  return [];
}

// The scan finds a window that contains the phrase, but that window starts
// wherever the scan began — so it can include whole paragraphs before the
// sentence. Slide the front edge forward as far as it will go while the
// phrase is still inside, and box only what is left.
function trim(items, start, end, probe) {
  const joined = (a, b) => norm(items.slice(a, b + 1).map(i => i.str).join(' '));
  let first = start;
  while (first < end && joined(first + 1, end).includes(probe)) first++;
  return items.slice(first, end + 1);
}

function box(item, viewport, sheet) {
  const t = pdfjs.Util.transform(viewport.transform, item.transform);
  const h = Math.hypot(t[2], t[3]) || item.height;
  const el = document.createElement('div');
  el.className = 'hl';
  el.style.left = t[4] + 'px';
  el.style.top = (t[5] - h) + 'px';
  el.style.width = (item.width * viewport.scale) + 'px';
  el.style.height = (h * 1.15) + 'px';
  sheet.appendChild(el);
}

document.getElementById('prev').onclick = () => { if (current > 1) render(--current); };
document.getElementById('next').onclick = () => { if (current < pdf.numPages) render(++current); };

try {
  pdf = await pdfjs.getDocument(url).promise;
  if (current > pdf.numPages) {
    note.hidden = false;
    note.textContent = `That document has ${pdf.numPages} pages; opening the last one.`;
    current = pdf.numPages;
  }
  await render(current);
} catch (err) {
  document.querySelector('main').textContent = 'That document could not be opened: ' + err.message;
}
</script>
</body>
</html>
