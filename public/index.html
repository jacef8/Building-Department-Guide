// ══════════════════════════════════════════════════════════════════════
// Simple keyword-overlap retrieval — good enough for a knowledge base
// this size. Swap for real embeddings if the corpus grows much larger.
// ══════════════════════════════════════════════════════════════════════
const STOPWORDS = new Set(['a','an','the','is','are','was','were','be','been','being','to','of','and','or','in','on','at','for','with','by','from','as','that','this','it','do','does','did','can','could','should','would','will','shall','what','when','where','who','how','why','if','my','me','i','we','our','you','your','their','they']);

// ══════════════════════════════════════════════════════════════════════
// Reference index — the full text of the Land Development Code and the
// Comprehensive Plan, split into passages that keep their section heading
// and page number (public/docs/reference-index.json, built by
// scripts/build-index.js). The entries in KNOWLEDGE_BASE above are curated
// summaries and settled department decisions; this is the source text
// itself, so questions the summaries never anticipated ("can I split a
// parcel into 3?") can still be answered and cited.
// ══════════════════════════════════════════════════════════════════════
let REFERENCE_INDEX = [];
let referenceLoad = null;
function loadReferenceIndex() {
  if (!referenceLoad) {
    referenceLoad = fetch('/docs/reference-index.json')
      .then(r => (r.ok ? r.json() : []))
      .then(list => { REFERENCE_INDEX = Array.isArray(list) ? list : []; return REFERENCE_INDEX; })
      .catch(() => { REFERENCE_INDEX = []; return REFERENCE_INDEX; });
  }
  return referenceLoad;
}

function stem(w) {
  if (w.length < 4) return w;
  return w.replace(/ies$/, 'y').replace(/(sses|shes|ches|xes)$/, m => m.slice(0, -2)).replace(/([^s])s$/, '$1');
}

function tokenize(str) {
  return str.toLowerCase().replace(/[^a-z0-9$.\s]/g, ' ').split(/\s+/)
    .filter(w => w.length > 1 && !STOPWORDS.has(w)).map(stem);
}

// The words people use at the counter are not the words the code uses.
// Each group is mutually interchangeable at search time.
const SYNONYMS = [
  ['split', 'divide', 'division', 'subdivide', 'subdivision', 'partition', 'separate'],
  ['parcel', 'lot', 'tract', 'property', 'acreage'],
  ['setback', 'distance', 'buffer', 'yard'],
  ['size', 'area', 'acreage', 'square', 'dimension', 'minimum'],
  ['house', 'home', 'dwelling', 'residence', 'residential'],
  ['barn', 'shed', 'outbuilding', 'garage'],   // not 'accessory': it is a section title, and boosting it buries Rule 1
  ['business', 'commercial', 'store', 'retail', 'shop'],
  ['road', 'street', 'driveway', 'easement', 'right-of-way'],
  ['sign', 'billboard'],
  ['mobile', 'manufactured', 'trailer'],
  ['fee', 'cost', 'charge', 'price'],
  ['permit', 'permitting', 'application'],
  ['zoning', 'zone', 'district', 'land-use', 'category'],
  ['flood', 'floodplain', 'wetland'],
  ['density', 'units', 'dwelling'],
  ['rv', 'camper', 'recreational'],
  ['tower', 'antenna', 'telecommunication', 'wireless'],
  ['tall', 'height', 'stories', 'story', 'feet'],
  ['exempt', 'exemption', 'exception', 'excluded'],
].map(g => g.map(stem));

function expandTokens(tokens) {
  const out = new Set(tokens);
  tokens.forEach(t => SYNONYMS.forEach(group => {
    if (group.includes(t)) group.forEach(g => out.add(g));
  }));
  return out;
}

const _tokenCache = new WeakMap();
function chunkTokens(chunk) {
  let v = _tokenCache.get(chunk);
  if (!v) {
    const title = tokenize(chunk.section || '');
    const bodyTokens = tokenize(chunk.text || '');
    // punctuation-free copy for phrase matching: the code writes "ten (10) acres",
    // so a search for "10 acres" only lands if the brackets are flattened first
    const hay = (chunk.section + ' ' + chunk.text).toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ');
    v = { title: new Set(title), body: new Set(bodyTokens), all: new Set([...title, ...bodyTokens]), hay };
    _tokenCache.set(chunk, v);
  }
  return v;
}

// Pass a Map as scoreOut to receive each ranked chunk's score — the citation
// list under an answer uses it to drop passages that only matched in passing.
function retrieveChunks(query, topN = 5, scoreOut = null) {
  const pool = KNOWLEDGE_BASE.concat(REFERENCE_INDEX);
  const qRaw = tokenize(query);
  if (!qRaw.length) return [];
  const qSet = expandTokens(qRaw);
  const qDirect = new Set(qRaw);

  // inverse document frequency: a word in half the corpus says little
  const df = new Map();
  pool.forEach(c => chunkTokens(c).all.forEach(t => { if (qSet.has(t)) df.set(t, (df.get(t) || 0) + 1); }));
  const N = pool.length;
  const idf = t => Math.log(1 + N / (1 + (df.get(t) || 0)));

  // Exact wording is the strongest signal there is: "pole barn house" means
  // something different from "pole barn", and no amount of word-level scoring
  // separates them. Phrases are matched against the raw text, not the stems.
  const phrase = query.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  // keep numbers: "10 acres" and "3 lots" are exactly the phrases that matter
  const words = phrase.split(' ').filter(w => (w.length > 2 || /^\d+$/.test(w)) && !STOPWORDS.has(w));
  const bigrams = [], trigrams = [];
  for (let i = 0; i < words.length - 1; i++) bigrams.push(words[i] + ' ' + words[i + 1]);
  for (let i = 0; i < words.length - 2; i++) trigrams.push(words[i] + ' ' + words[i + 1] + ' ' + words[i + 2]);

  const scored = pool.map(chunk => {
    const tk = chunkTokens(chunk);
    let score = 0;
    qSet.forEach(qt => {
      const direct = qDirect.has(qt);
      const weight = idf(qt) * (direct ? 1 : 0.3);   // synonyms count, but less
      if (tk.title.has(qt)) score += 2.2 * weight;
      else if (tk.body.has(qt)) score += 1 * weight;
    });
    const hay = tk.hay;
    bigrams.forEach(b => { if (hay.includes(b)) score += 3; });
    trigrams.forEach(g => { if (hay.includes(g)) score += 6; });
    // curated entries are settled decisions; prefer them on a tie
    if (!chunk.id) score *= 1.12;
    return { chunk, score };
  });

  scored.sort((a, b) => b.score - a.score);
  const ranked = scored.filter(s => s.score > 0);

  // Spread the picks. The same rule is often restated in the guide, the
  // eligibility guide and the fee schedule, and without a cap those near
  // duplicates fill every slot and push out the one document that actually
  // answers the question (the Land Development Code, usually). Caps first,
  // then backfill by score so short lists are never starved.
  // One document may not take more than about four of the nine slots. At
  // 0.7 it could take seven, and the Eligibility Guide — which the indexer
  // had split into dozens of pieces under table-column titles — regularly
  // did, crowding out the document that actually answered the question.
  const perSource = Math.max(2, Math.ceil(topN * 0.4));
  const picked = [], seenSection = new Set(), bySource = new Map();
  for (const { chunk } of ranked) {
    if (picked.length >= topN) break;
    const key = chunk.source + '|' + chunk.section;
    const used = bySource.get(chunk.source) || 0;
    if (seenSection.has(key) || used >= perSource) continue;
    picked.push(chunk); seenSection.add(key); bySource.set(chunk.source, used + 1);
  }
  for (const { chunk } of ranked) {
    if (picked.length >= topN) break;
    if (!picked.includes(chunk)) picked.push(chunk);
  }
  if (scoreOut) ranked.forEach(({ chunk, score }) => scoreOut.set(chunk, score));
  return picked;
}

// ══════════════════════════════════════════════════════════════════════
// Which of the retrieved passages are worth showing as citations
//
// Retrieval always returns its nine best guesses, and "best" only has to beat
// a score of zero. Ask something the documents have nothing to say about and
// it still returns nine — a staff member asking about the phone version of
// this tool got the fee schedule, the exemption form and two sections of the
// Code, which had matched on the words "using", "tool", "phone" and "use".
// Listing them under the answer implies the answer came from them.
//
// Two filters, both measured against the retrieved scores rather than guessed:
//   1. Relevance. Divide the top score by the number of content words in the
//      question, so a long question isn't rewarded for accumulating matches.
//      Across fifty real counter questions all but one scored 3.1 or better;
//      across sixteen off-topic ones all but two scored under 2.8, and those
//      two asked about printing and about a county commissioner — words the
//      documents really do use. Below the gate nothing retrieved is about the
//      question, so the list is dropped entirely.
//   2. The tail. Within a relevant set, a passage scoring under a third of the
//      top hit is background noise — on "what is the setback for a wellhead"
//      that is the difference between four real citations and nine.
// The passages still go to the model either way; this only governs what is
// listed to the reader as the basis for the answer.
// ══════════════════════════════════════════════════════════════════════
const CITE_MIN_RELEVANCE = 3.0;   // top score per content word of the question
const CITE_TAIL_SHARE = 0.3;      // keep passages scoring >= this share of the top

function citableSources(chunks, scores, question) {
  if (!chunks || !chunks.length) return [];
  const top = scores.get(chunks[0]) || 0;
  if (!top) return [];
  const asked = tokenize(question);
  if (top / Math.max(1, asked.length) < CITE_MIN_RELEVANCE) return [];
  // One strong match on one word is not a match on the question. "What is the
  // staff password" cleared the gate on "staff" alone, against a passage
  // titled "Summary checklist for staff". A question of two or more words has
  // to be answered on at least two of them.
  if (asked.length >= 2) {
    const best = new Set();
    chunks.slice(0, 3).forEach(c => chunkTokens(c).all.forEach(t => best.add(t)));
    const matched = asked.filter(t => best.has(t)).length;
    if (matched < 2) return [];
  }
  return chunks.filter(c => (scores.get(c) || 0) >= top * CITE_TAIL_SHARE);
}

// ══════════════════════════════════════════════════════════════════════
// Whole-project questions ("what are the steps and permits for building a
// pole barn house?", "what permits do I need and what do they cost?")
//
// These need different handling than a single lookup: one project touches
// half the knowledge base at once — septic, setbacks, the notice of
// commencement, owner-builder rules, electrical, fees — so top-5 keyword
// retrieval reliably misses most of the sequence. Two adjustments:
//   1. expand the query with the vocabulary the documents actually use,
//      since applicants describe projects in their own words ("pole barn
//      house" never appears next to "Notice of Commencement" in any doc);
//   2. pull more chunks and ask the server for a step-by-step answer.
// ══════════════════════════════════════════════════════════════════════
// "dos/donts", "do's and don'ts", "dos & don'ts" — applicants write it every way
const GUIDE_INTENT = /\b(steps?|step[- ]by[- ]step|process|procedure|walk me through|start to finish|beginning to end|checklist|what all|everything i need|do'?s\s*(?:and|&|\/)\s*don'?t?s|in order|timeline|where do i (start|begin)|how do i (get|start|go about|begin|build))\b/i;
const NEEDS_LIST = /\b(what|which)\b[^?]{0,40}\b(permits?|forms?|paperwork|documents?|inspections?)\b[^?]{0,40}\b(do|does|will|would|are)\b/i;
const BUILD_VERB = /\b(build|building|construct|constructing|put up|putting up|set up|setting up|install|installing|erect|add(ing)? on)\b/i;

// "building permit", "accessory building", "building department" use "building"
// as a NOUN, not a verb. Without stripping those, "what's not included in an
// accessory building permit?" was treated as a whole-project question — pulling
// 18 chunks and burying the one entry that actually answered it.
function stripBuildingNouns(q) {
  return q
    .replace(/\baccessory building\b/gi, ' ')
    .replace(/\bbuilding (permits?|departments?|officials?|codes?|plans?|applications?)\b/gi, ' ')
    .replace(/\bnew construction\b/gi, ' ');
}

function isGuideQuestion(q) {
  if (GUIDE_INTENT.test(q)) return true;
  if (NEEDS_LIST.test(q)) return true;
  // "We want to build X — what do we need?" phrasing without any keyword above
  if (BUILD_VERB.test(stripBuildingNouns(q)) && /\b(permits?|need|require)/i.test(q)) return true;
  return false;
}

// Applicant wording → the vocabulary used in the source documents. Keeping
// this as an explicit table (rather than letting the model guess) means
// retrieval stays predictable and every expansion is reviewable by staff.
const TOPIC_EXPANSIONS = [
  { match: /pole barn|barndominium|barndo|metal building/i,
    terms: 'accessory building pole barn new construction residential building permit setbacks notice of commencement owner-builder septic DEP environmental protection electrical certificate of occupancy site plan review' },
  { match: /\b(house|home|dwelling|residence|cabin|single[- ]family)\b/i,
    terms: 'new construction residential building permit setbacks septic DEP environmental protection notice of commencement owner-builder electrical plumbing hvac mechanical certificate of occupancy' },
  { match: /mobile home|manufactured home|trailer|doublewide|double wide|singlewide/i,
    terms: 'mobile home set-up licensed installer blocking tie-down site plan review septic electrical' },
  { match: /\b(shed|carport|garage|workshop|outbuilding|barn|storage building)\b/i,
    terms: 'accessory building setbacks accessory structure permit fee' },
  { match: /\b(adu|accessory dwelling|mother[- ]in[- ]law|guest house)\b/i,
    terms: 'accessory dwelling unit ADU pre-manufactured site plan review tier 1 setbacks installer' },
  { match: /\b(remodel|renovat|addition|add a room|bathroom|kitchen|flooring|drywall)\b/i,
    terms: 'renovations exemption 7500 residential exemption permit required plumbing mechanical structural' },
  { match: /\broof/i, terms: 'roofing private provider inspection permit fee' },
  { match: /\b(solar|generator|power pole|service upgrade|electric)/i, terms: 'electrical affidavit service upgrade solar generator licensed electrical contractor' },
  { match: /\b(pool|spa)\b/i, terms: 'pools barrier permit' },
  { match: /\bsign\b/i, terms: 'sign regulations size limits permit' },
  { match: /\b(tower|antenna|cell)\b/i, terms: 'communication tower wireless application requirements' },
  { match: /\b(subdivi|plat|lot split)/i, terms: 'subdivision plat minimum design standards review' },
  { match: /\b(flood|wetland|river|creek|water)\b/i, terms: 'floodplain wetland river buffer wellhead protection' }
];

// The most common question at the counter, asked in the words staff use:
// "how do I know if I need a permit". Every word in it — know, need, permit —
// is among the most common in the documents, so it carries no signal at all,
// and the one document written to answer it ("What Needs a Permit, and What
// Doesn't") never surfaced for any phrasing of it. This bridges the question
// to the vocabulary the documents are actually written in. It is the only
// expansion that applies to a narrow lookup rather than a whole-project one.
const PERMIT_NEEDED = /\b(need|needs|needed|require[sd]?|necessary)\b[^?]{0,24}\bpermit\b|\bpermit\b[^?]{0,24}\b(need|needed|required|necessary)\b|\bhow (do|would) (i|we|you) know\b[^?]{0,30}\bpermit\b|\bwhen (is|do|does)\b[^?]{0,24}\bpermit\b|\bexempt\w*\b[^?]{0,24}\bpermit\b|\bpermit\b[^?]{0,24}\bexempt\w*\b|\bwithout a permit\b|\bdo i need one\b/i;
// "How far from the property line can the barn go" has none of the words the
// setback table is written in, so it never reached it and the answer came back
// saying the distances were not in the material. They are.
const SETBACK_QUESTION = /\b(setback|set back)\b|how (far|close)\b[^?]{0,40}\b(line|road|street|right[- ]of[- ]way|neighbou?r|edge|boundary)\b|\b(property|lot) line\b|\bhow (far|close)\b[^?]{0,30}\bbuild\b|\bwhere (can|do|should)\b[^?]{0,40}\b(put|place|build|sit|go)\b|\byard (requirement|standard)/i;
const SETBACK_TERMS = 'setback front yard side yard rear yard corner yard Schedule 1.0 minimum '
  + 'development standards building height property line land use category';

const PERMIT_SPECIFIC = /\b(fence|roof\w*|walls?|deck|porch|patio|carport|pool|spa|shed|barn|garage|tower|antenna|signs?|driveway|culvert|septic|wellhead|well|dock|seawall|solar|generator|mobile home|manufactured home|trailer|rv|camper|addition|demoli\w*|subdivi\w*|plat|split|lot|parcel|setbacks?|tiny home|adu|accessory dwelling|certificate of occupancy|site plan|rezoning|variance|special exception|conditional use)\b/i;
const PERMIT_NEEDED_TERMS = 'exempt exemption no permit needed cosmetic non-structural 7500 declared value '
  + 'flood hazard area project splitting electrical plumbing mechanical gas structural trades '
  + 'written request for exemption HB 803 double fee single-family';

function expandQuery(question, isGuide) {
  // "Do I need a permit for a fence" is a fence question, not an exemption
  // question — it names its subject, and that subject has its own rules. The
  // bridge is only for the general question, so a named structure or trade
  // vetoes it. The cosmetic trades are deliberately absent from the veto:
  // painting, flooring and cabinets ARE the exemption's own examples.
  const permitTest = (PERMIT_NEEDED.test(question) && !PERMIT_SPECIFIC.test(question))
    ? ' ' + PERMIT_NEEDED_TERMS : '';
  // A wellhead "setback" is a radius around a well, not a yard off a lot
  // line, and it has its own entry — widening it with yard vocabulary buried
  // that entry and the answer lost its citations.
  const setbackTest = (SETBACK_QUESTION.test(question) && !/\bwell\b|\bwellhead\b|\bwellfield\b|water supply/i.test(question))
    ? ' ' + SETBACK_TERMS : '';
  // Expansion is ONLY for whole-project questions, which need a wide net across
  // many sections. Applying it to a narrow lookup actively hurts: "what's the
  // minimum lot size for a single-family home?" would match the house
  // expansion, flood the query with new-construction vocabulary, and push the
  // one chunk that actually answers it out of the top 5.
  if (!isGuide) return question + permitTest + setbackTest;

  const extra = TOPIC_EXPANSIONS.filter(t => t.match.test(question)).map(t => t.terms);
  // Always pull in the cross-cutting steps that apply to essentially every
  // project regardless of what's being built.
  extra.push('permit fee required form application inspection setbacks notice of commencement');
  return question + permitTest + setbackTest + ' ' + extra.join(' ');
}

// ══════════════════════════════════════════════════════════════════════
// Parcel lookup — Liberty County's tax roll, served by /api/parcel
// A message is treated as a parcel lookup if it's mostly digits/dashes/
// dots and doesn't look like a normal question (no letters other than
// what a parcel number legitimately contains). This is a deterministic
// heuristic, not an AI guess, so it's predictable to test and debug.
// ══════════════════════════════════════════════════════════════════════
// A Liberty County parcel number carries the township and range inside it —
// 0195S3W00001000 is section 19, township 5S, range 3W. So it is NOT all
// digits, and the old digits-only test rejected every real parcel number
// staff type. A candidate is a run of digits and letters, at least 8
// characters, mostly digits, whose only letters are the direction letters
// N/S/E/W. Written with or without dashes, either works.
const PARCEL_TOKEN = /\b(?=[0-9\-.]*[0-9][0-9\-.]*[NSEW])[0-9][0-9NSEW\-.]{6,24}[0-9]\b/i;

function normaliseParcelKey(s) {
  return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function looksLikeParcelId(input) {
  const trimmed = (input || '').trim();
  if (trimmed.length < 5) return false;
  const key = normaliseParcelKey(trimmed);
  if (key.length < 8 || key.length > 25) return false;
  // Only digits and direction letters, and at least two-thirds digits.
  if (!/^[0-9NSEW]+$/.test(key)) return false;
  const digits = (key.match(/\d/g) || []).length;
  return digits >= 6 && digits / key.length >= 0.66;
}

// A name or a road is what people actually have at the counter ("the Strickland
// place", "out on Buckeye Lane"), so a short bare phrase is tried as a property
// search before it is treated as a question. Anything that looks like a
// permitting topic is left alone, and a search that finds nothing falls through
// to the knowledge base, so this can only ever add an answer, never block one.
const PERMIT_TOPIC_WORDS = /\b(porch|deck|ramp|fee|fees|permit|permits|shed|barn|roof|roofing|pool|sign|septic|tower|fence|carport|patio|garage|mobile home|setback|setbacks|variance|inspection|inspections|plat|split|zoning|flood|electrical|plumbing|hvac|solar|demolition|renovation|addition|exemption|affidavit|form|forms|application|code|ldc|comp plan|homestead)\b/i;

function looksLikePropertySearch(input) {
  const t = (input || '').trim();
  if (t.length < 4 || t.length > 28) return false;
  if (/[?]/.test(t)) return false;
  const words = t.split(/\s+/);
  if (words.length > 3) return false;
  if (/^(what|when|where|who|how|why|can|do|does|is|are|should|must|need|tell|show|list)\b/i.test(t)) return false;
  if (PERMIT_TOPIC_WORDS.test(t)) return false;
  return /^[A-Za-z][A-Za-z .,'&-]*$/.test(t);
}

// "can 01-9S-3W-0000-1000 be split into three lots?" is a question about a
// parcel, not a bare lookup — pull the number out so the answer can use it.
function extractParcelId(input) {
  const trimmed = (input || '').trim();
  if (looksLikeParcelId(trimmed)) return trimmed;
  const m = trimmed.match(PARCEL_TOKEN);
  if (m && looksLikeParcelId(m[0])) return m[0];
  return null;
}

//
// maxPerAcre is the ceiling with no central water or sewer, which is the
// normal case in the county. Where central service changes the ceiling, the
// note says so — it is never assumed.
// ══════════════════════════════════════════════════════════════════════

// The roll stores the use code as three characters ("001", "087"); the
// standard schedule above is keyed on the last two.
function parcelUseLabel(p) {
  const code = (p.uc || '').toString().padStart(2, '0').slice(-2);
  return { code, label: DOR_USE_CODES[code] || 'Not in the standard DOR schedule' };
}

const money = (n) => '$' + Number(n || 0).toLocaleString('en-US');

// The tax roll reports every split and combine the Property Appraiser made
// since the previous year's assessment: a five-digit code where the first
// digit is 1 for a split or 2 for a combine, then the month and year.
// "10725" is a split in July 2025. Nobody has to track this by hand — the
// Appraiser records it and the county receives it every year.
const MONTHS = ['', 'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];

function splitFlag(code) {
  const v = String(code || '').padStart(5, '0');
  if (!/^[12]\d{4}$/.test(v)) return null;
  const month = Number(v.slice(1, 3));
  const year = Number(v.slice(3));
  return {
    action: v[0] === '1' ? 'split' : 'combined',
    when: `${MONTHS[month] || 'month ' + month} 20${String(year).padStart(2, '0')}`,
  };
}
const acresText = (p) => p.acres ? `${p.acres.toLocaleString('en-US')} acre${p.acres === 1 ? '' : 's'}` : 'not on the roll';

// What the roll says about the property, in the order someone at the counter
// would want it: where it is, who owns it, how big, what is already on it.
function describeParcel(p) {
  const use = parcelUseLabel(p);
  const site = [p.adr, p.cty, p.zip].filter(Boolean).join(', ');
  const mailing = [p.oad, [p.oci, p.ost].filter(Boolean).join(', '), p.ozp].filter(Boolean).join(' ');
  const rows = [
    ['Parcel', p.id],
    ['Site address', site || 'none on the roll (vacant land often has none)'],
    ['Owner of record', p.own || 'not on the roll'],
    ['Owner mailing', mailing || 'not on the roll'],
    ['Use on the tax roll', `${use.label} (DOR code ${use.code})`],
    ['Land area', acresText(p) + (p.chk ? ' — the roll\'s two acreage fields disagree, confirm with the Property Appraiser' : '')],
    ['Legal description', p.leg || 'not on the roll'],
    ['Section / Township / Range', [p.sec, p.twn, p.rng].filter(Boolean).join(' - ') || 'not on the roll'],
  ];
  if (p.bld) {
    rows.push(['Buildings on the roll', `${p.bld}${p.res ? `, ${p.res} residential unit${p.res === 1 ? '' : 's'}` : ''}`]);
    if (p.liv) rows.push(['Heated living area', `${p.liv.toLocaleString('en-US')} sq ft`]);
    if (p.yr) rows.push(['Year built', String(p.yr)]);
  } else {
    rows.push(['Buildings on the roll', 'none — the roll shows this as unimproved']);
  }
  rows.push(['Just value', p.jv ? money(p.jv) + (p.lv ? ` (land ${money(p.lv)})` : '') : 'not on the roll']);
  rows.push(['Homestead exemption', p.hs ? 'yes — the owner claims this as their residence' : 'no homestead on this parcel']);
  const flag = splitFlag(p.splt);
  if (flag) rows.push(['Split or combine on the roll', `${flag.action} in ${flag.when}, per the Property Appraiser`]);
  if ((p.related || []).length) {
    rows.push(['Parcels under the same root', (p.related || [])
      .map(r => `${r.id} (${r.acres ? r.acres + ' ac' : 'acreage not on the roll'}, ${r.own || 'owner not on the roll'}${splitFlag(r.splt) ? `, ${splitFlag(r.splt).action} ${splitFlag(r.splt).when}` : ''})`)
      .join('\n                            ')]);
  }
  if (p.syr) rows.push(['Last recorded sale', `${p.smo ? p.smo + '/' : ''}${p.syr}${p.spr ? ' for ' + money(p.spr) : ''}${p.bk ? `, OR book ${p.bk} page ${p.pg}` : ''}`]);
  return rows.map(([k, v]) => `${k}: ${v}`).join('\n');
}

// Deterministic notes — these come from the settled rules, not from the model,
// so they say the same thing every time. Anything the roll cannot answer is
// named as such rather than guessed.
// Once the category is known, the ceiling on this parcel is arithmetic.
function fluNote(p) {
  const cat = FLU_CATEGORIES[p.flu];
  if (!cat) return null;
  const acres = p.acres || 0;
  let line = `Future land use — ${p.flu} (read off the county map): ${cat.density}. ${cat.note}`;
  if (acres && cat.maxPerAcre > 0) {
    const max = Math.floor(acres * cat.maxPerAcre);
    line += ` At ${acresText(p)}, that is a ceiling of about ${max} dwelling unit${max === 1 ? '' : 's'}${max === 0 ? ' — the parcel is under the minimum for even one, so a single home here rests on the parent-tract right rather than on density' : ''}.`;
  }
  line += ' Confirm the category against the Future Land Use Map before quoting it; where a boundary is unclear the Plan has a boundary interpretation rule, and a parent tract of record is granted at least one single family unit.';
  return line;
}

function parcelPermitNotes(p) {
  const use = parcelUseLabel(p);
  const notes = [];
  const acres = p.acres || 0;
  const flu = fluNote(p);
  if (flu) notes.push(flu);

  if (acres >= 1) {
    const tenAcreLots = Math.floor(acres / 10);
    if (acres >= 20) {
      notes.push(`Splitting it: at ${acresText(p)}, a division into two lots is a Property Split Review ($150.00). Three or more lots is a subdivision under LDC Section 5.2 and needs plat approval ($1,000.00 or $25.00 per lot, whichever is greater) — unless every resulting parcel is ten acres or more and there are no more than 15 of them, which is exempt from platting. This parcel could yield about ${tenAcreLots} ten-acre parcel${tenAcreLots === 1 ? '' : 's'}${tenAcreLots > 15 ? ', which is past the 15-parcel exemption, so a plat would be required' : ', which is within that exemption'}. Any division that creates a new street is a subdivision no matter how few lots it makes.`);
    } else {
      notes.push(`Splitting it: at ${acresText(p)}, a division into two lots is a Property Split Review ($150.00); three or more lots is a subdivision needing plat approval. Every resulting lot still has to meet the minimum lot size, width and density for its future land use category, which at this size is the binding constraint.`);
    }
  }

  if (!p.bld) {
    notes.push('Building on it: the roll shows no structures, so new construction applies — Tier 1 Site Plan Review ($100.00), a confirmed 911 address before any inspection, residential building permit at $0.75 per square foot, and a recorded Notice of Commencement before the first inspection when the job value is over $2,500.');
  } else if (use.code === '02') {
    notes.push(`Mobile home: the roll shows a mobile home here. A replacement or new set-up is the Mobile Home Set-Up Permit ($300.00, all sizes), which does not include electrical — the service or reconnect is a separate Electrical permit.`);
  } else {
    notes.push(`Already improved: ${p.bld} building${p.bld === 1 ? '' : 's'} on the roll${p.liv ? ` totalling ${p.liv.toLocaleString('en-US')} sq ft of living area` : ''}, so most work here is renovation or addition. An addition is charged at the per-square-foot rate; a porch, covered patio or attached carport is $125.00 flat; an uncovered deck or ramp is $100.00.`);
  }

  if (p.hs) {
    notes.push('Owner-builder: the parcel carries a homestead exemption, so it is the owner\'s own residence and the owner-builder exemption is available to them (no exemption for pools, and the affidavit still applies).');
  } else if (p.ost && p.ost !== 'FL') {
    notes.push(`Owner-builder: the owner's mailing address is in ${p.ost} and there is no homestead here, so do not assume owner-builder status — it applies only to property the owner occupies.`);
  }

  const flag = splitFlag(p.splt);
  const kin = (p.related || []).length;
  if (flag || kin) {
    const parts = [];
    if (flag) parts.push(`The Property Appraiser recorded this parcel as ${flag.action} in ${flag.when}.`);
    if (kin) {
      const kinSplits = (p.related || []).filter(r => splitFlag(r.splt)).length;
      parts.push(`The Appraiser numbers ${kin} other parcel${kin === 1 ? '' : 's'} under the same root as this one (${p.id.slice(0, 12)}…), which usually means they came off the same original tract${kinSplits ? `, and ${kinSplits} of them carries a split or combine flag of its own` : ''}. They are listed above.`);
    }
    parts.push('That is the Appraiser’s numbering and annual split flag, not a title search — it shows what has already come off this land without anyone tracking it by hand, but confirm it with the Property Appraiser before it decides an application.');
    notes.push('Splits already recorded: ' + parts.join(' '));
  }

  if (!flu) {
    notes.push(`What the roll cannot tell you: it carries the tax use code, not the future land use category, and it says nothing about flood zone or the 75-foot river buffer. Density, setbacks and minimum lot size all turn on the future land use category. Find this parcel on the [Future Land Use Map](/docs/future-land-use-map.pdf) — it is in Section ${p.sec || '?'}, Township ${p.twn || '?'}, Range ${p.rng || '?'} — then set the category above and the density ceiling will be calculated for you.`);
  } else {
    notes.push('What the roll still cannot tell you: flood zone, wetlands, and the 75-foot native vegetation buffer required along the Apalachicola River, the Ochlockonee River, Telogia Creek and the New River. Those are checked separately.');
  }
  return notes;
}

// A compact version of the same facts for the model to answer follow-up
// questions against.
function parcelContextBlock(p) {
  const use = parcelUseLabel(p);
  return [
    `ACTIVE PARCEL (Liberty County ${PARCEL_META.assessmentYear || ''} tax roll, assessed January 1 — ownership and improvements only, NOT zoning, NOT future land use, NOT flood zone):`,
    `Parcel number: ${p.id}`,
    `Owner: ${p.own || 'not on the roll'}${p.hs ? ' (homestead exemption — owner-occupied)' : ''}`,
    `Owner mailing: ${[p.oad, p.oci, p.ost, p.ozp].filter(Boolean).join(' ') || 'not on the roll'}`,
    `Site address: ${[p.adr, p.cty, p.zip].filter(Boolean).join(', ') || 'none on the roll'}`,
    `Tax roll use: ${use.label} (DOR code ${use.code})`,
    `Land area: ${acresText(p)}${p.chk ? ' (the roll\'s acreage fields disagree — say so rather than relying on it)' : ''}`,
    `Legal: ${p.leg || 'not on the roll'}`,
    `Section/Township/Range: ${[p.sec, p.twn, p.rng].filter(Boolean).join('-') || 'not on the roll'}`,
    `Improvements: ${p.bld ? `${p.bld} building(s), ${p.res || 0} residential unit(s), ${p.liv || 0} sq ft living area, built ${p.yr || 'unknown'}` : 'none on the roll (unimproved)'}`,
    p.flu
      ? `Future land use category: ${p.flu} — READ OFF THE COUNTY MAP BY STAFF, not from the roll. Density: ${FLU_CATEGORIES[p.flu].density}. ${FLU_CATEGORIES[p.flu].note} Use this for density, lot size and what uses are allowed.`
      : 'Future land use category: NOT SET. Do not state or guess it. If the question turns on density, lot size or allowed use, say the category has to be read off the Future Land Use Map first, and give the rule for the category once known.',
    `Just value: ${p.jv ? money(p.jv) : 'not on the roll'}`,
    splitFlag(p.splt) ? `Split history: the Property Appraiser recorded this parcel as ${splitFlag(p.splt).action} in ${splitFlag(p.splt).when}.` : '',
    (p.related || []).length ? `Parcels numbered under the same root (usually pieces of the same original tract, per the Appraiser's numbering — a lead to confirm, not a title search): ${(p.related || []).map(r => `${r.id} ${r.acres || '?'} ac${splitFlag(r.splt) ? ' (' + splitFlag(r.splt).action + ' ' + splitFlag(r.splt).when + ')' : ''}`).join('; ')}` : '',
    p.syr ? `Last recorded sale: ${p.smo ? p.smo + '/' : ''}${p.syr}${p.spr ? ' for ' + money(p.spr) : ''}${p.bk ? `, OR book ${p.bk} page ${p.pg}` : ''}` : '',
    '',
    'Use these facts when they bear on the question. Acreage governs split and density questions; whether there are buildings governs new construction versus renovation; homestead indicates owner-occupancy for owner-builder. Do not state the zoning, future land use category, flood zone or river buffer from this data — it does not contain them.',
  ].filter(Boolean).join('\n');
}

function formatParcelResult(data, searchedFor) {
  const found = (data && data.parcels) || [];
  if (!found.length) {
    return `No parcel matching "${searchedFor}" is in the Liberty County tax roll this tool carries (${(data && data.meta && data.meta.count) || 0} parcels, ${(data && data.meta && data.meta.assessmentYear) || ''} roll). Check the number, or try the owner's last name or the road name — both work here. The Property Appraiser's own site is the live, authoritative source: use the "Look up a parcel" link above.`;
  }

  if (found.length > 1) {
    const lines = [`${data.total} parcels match "${searchedFor}" by ${data.matchedOn}${data.total > found.length ? ` — the first ${found.length} are below` : ''}. Type the full parcel number to pull one up.`];
    found.forEach((p, i) => {
      const use = parcelUseLabel(p);
      lines.push(`${i + 1}. ${p.id} — ${p.own || 'owner not on the roll'}\n${[p.adr, p.cty].filter(Boolean).join(', ') || 'no site address'} · ${acresText(p)} · ${use.label}`);
    });
    return lines.join('\n\n');
  }

  const p = found[0];
  if (data.related) p.related = data.related;
  const notes = parcelPermitNotes(p);
  return [
    describeParcel(p),
    '**What this means for permitting**',
    notes.map(n => '- ' + n).join('\n\n'),
    `_Liberty County ${data.meta.assessmentYear || ''} tax roll (Florida Department of Revenue), values as of January 1. Ask your next question and it will be answered for this parcel._`,
  ].join('\n\n');
}

// App state & rendering

let isLoading = false;
let lastError = null;
let kbDropdownOpen = false;

let focusInputNext = false;

// every following question is answered for that property until it's cleared

let activeParcel = null;
let PARCEL_META = {};

let STAFF_CONFIGURED = false;

// On the staff route, install as a distinct app whose start_url is /staff, so

// ══════════════════════════════════════════════════════════════════════
// Staff <-> public preview (for testing)
//
// The version is still decided purely by the URL — this only adds the
// navigation. The "back to staff" link is remembered in sessionStorage, which
// is per-tab/per-window and dies with it, so it appears only inside a preview
// the staff member started. A member of the public opening the app on a shared
// counter machine never sees it, even if that browser holds a staff cookie.
// ══════════════════════════════════════════════════════════════════════
// Streaming died in production on Railway's Node 18, whose global fetch is
// experimental and is known to drop long-lived streaming response bodies: the
// first delta arrived and the upstream body then died. package.json now
// requires Node 22 (the build log confirms 22.23.1), so it's on by default.
//
// ?stream=0 forces it off for a single visit — the quick way to tell a
// streaming problem apart from an answer-quality one without a deploy.
const STREAMING_ENABLED = !/[?&]stream=0\b/.test(location.search);

// ══════════════════════════════════════════════════════════════════════
// Attachments — a plan, a site sketch, or a photo for the assistant to look at
//
// Files are read in the browser, sent as base64 with the question, and never
// stored anywhere: not on the server, and not in this browser's history (only
// the file NAME is kept, so a saved conversation stays small and a plan set
// isn't sitting in localStorage on a shared counter machine).
// ══════════════════════════════════════════════════════════════════════
const MAX_FILES = 5;
const MAX_FILE_BYTES = 8 * 1024 * 1024;
const MAX_TOTAL_BYTES = 20 * 1024 * 1024;
const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];

// Staff always; the public page only if the server says uploads are open.
let UPLOADS_ENABLED = false;
let pendingAttachments = [];

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('could not be read'));
    // readAsDataURL gives "data:<type>;base64,<data>" — keep only the data.
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.readAsDataURL(file);
  });
}

async function addFiles(fileList) {
  if (!UPLOADS_ENABLED) return;
  const files = Array.from(fileList || []);
  if (!files.length) return;

  const problems = [];
  for (const file of files) {
    const type = (file.type || '').toLowerCase();
    const isDoc = type === 'application/pdf';
    const isImage = IMAGE_TYPES.includes(type);

    if (!isDoc && !isImage) {
      problems.push(`"${file.name}" isn't a PDF or a picture.`);
      continue;
    }
    if (pendingAttachments.length >= MAX_FILES) {
      problems.push(`Only ${MAX_FILES} files can be attached at once.`);
      break;
    }
    if (file.size > MAX_FILE_BYTES) {
      problems.push(`"${file.name}" is ${formatBytes(file.size)} — the limit is ${MAX_FILE_BYTES / 1048576} MB per file.`);
      continue;
    }
    const total = pendingAttachments.reduce((sum, a) => sum + a.size, 0);
    if (total + file.size > MAX_TOTAL_BYTES) {
      problems.push('Those files add up to more than ' + (MAX_TOTAL_BYTES / 1048576) + ' MB in total.');
      break;
    }

    try {
      const data = await readAsBase64(file);
      if (!data) throw new Error('empty');
      pendingAttachments.push({
        name: file.name || (isDoc ? 'document.pdf' : 'image'),
        mediaType: type,
        kind: isDoc ? 'document' : 'image',
        size: file.size,
        data
      });
    } catch (e) {
      problems.push(`"${file.name}" could not be read.`);
    }
  }

  lastError = problems.length ? problems.join(' ') : null;
  render();
}

function removeAttachment(i) {
  pendingAttachments.splice(i, 1);
  render();
}

function handleFilePick(e) {
  addFiles(e.target.files);
  e.target.value = ''; // so picking the same file twice still fires onchange
}

// Screenshots and phone photos are usually pasted, not picked from a folder.
function handlePaste(e) {
  if (!UPLOADS_ENABLED || !e.clipboardData) return;
  const files = Array.from(e.clipboardData.files || []);
  if (files.length) { e.preventDefault(); addFiles(files); }
}

// Drag a file anywhere onto the chat.
document.addEventListener('dragover', (e) => {
  if (!UPLOADS_ENABLED || !e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  e.preventDefault();
  const chat = document.getElementById('chatArea');
  if (chat) chat.classList.add('dropping');
});
document.addEventListener('dragleave', (e) => {
  if (e.relatedTarget) return; // still inside the window
  const chat = document.getElementById('chatArea');
  if (chat) chat.classList.remove('dropping');
});
document.addEventListener('drop', (e) => {
  if (!UPLOADS_ENABLED || !e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  const chat = document.getElementById('chatArea');
  if (chat) chat.classList.remove('dropping');
  addFiles(e.dataTransfer.files);
});

const PREVIEW_FLAG = 'bda_preview_from_staff';

function readPreviewFlag() {

}

const PREVIEWING_PUBLIC = !ON_STAFF_ROUTE && readPreviewFlag();

function previewPublic() {

  location.href = '/';

function returnToStaff() {

// ══════════════════════════════════════════════════════════════════════
// Conversation history
//
// Past conversations are kept in this browser's localStorage — nothing is
// sent to or stored on the server, so a shared front-desk machine's history
// never leaves that machine and there's no record to manage county-side.
// Public and staff routes use separate keys so the two never mix.
// ══════════════════════════════════════════════════════════════════════
const HISTORY_KEY = ON_STAFF_ROUTE ? 'bda_history_staff_v1' : 'bda_history_public_v1';
const MAX_CONVERSATIONS = 25;   // oldest drop off past this
const MAX_TURNS_SENT = 8;       // prior messages included as follow-up context

let conversations = [];
let activeId = null;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    conversations = Array.isArray(parsed)
      ? parsed.filter(c => c && Array.isArray(c.messages) && c.messages.length)
      : [];
    // If the tab was closed mid-answer, the saved message still carries the
    // streaming flag — clear it so it renders as a finished message.
    conversations.forEach(c => c.messages.forEach(m => { delete m.streaming; }));
  } catch (e) {
    conversations = []; // corrupt or unavailable storage shouldn't break the app
  }
}

function saveHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(conversations.slice(0, MAX_CONVERSATIONS)));
  } catch (e) { /* private mode or quota — history just won't persist */ }
}

function conversationTitle(msgs) {
  const firstAsk = msgs.find(m => m.role === 'user');
  const t = firstAsk ? firstAsk.content.trim().replace(/\s+/g, ' ') : 'Untitled';
  return t.length > 90 ? t.slice(0, 90) + '…' : t;
}

// Writes the live `messages` array back into the stored conversation list,
// creating the conversation on the first question of a new thread.
function persistActive() {
  if (!messages.length) return;
  let conv = conversations.find(c => c.id === activeId);
  if (!conv) {
    conv = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), messages: [] };
    activeId = conv.id;
    conversations.unshift(conv);
  }
  conv.messages = messages;
  conv.title = conversationTitle(messages);
  // The parcel on the counter belongs to the conversation, not to the browser
  // session: reopening "the Kerby split" should put Kerby's parcel back on the
  // counter, and opening an unrelated conversation must not leave it there.
  conv.parcel = activeParcel;
  conv.updated = Date.now();
  conversations = conversations.slice(0, MAX_CONVERSATIONS);
  saveHistory();
}

function newConversation() {
  messages = [];
  activeParcel = null;
  toolsOpen = false;
  activeId = null;
  lastError = null;
  historyOpen = false;
  render();
}

// A conversation saved before parcels were kept with them carries no parcel on
// record — but it still contains one, in what was typed and in the report that
// came back. Rather than leave the older history half useful, read the parcel
// number and the land use category back out of the transcript.
function parcelIdFromMessages(msgs) {
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i];
    if (!m || !m.content) continue;
    const stated = String(m.content).match(/^Parcel:\s*([0-9A-Za-z\-]{8,25})/m)
      || String(m.content).match(/\bfor parcel\s+([0-9A-Za-z\-]{8,25})/i);
    if (stated && looksLikeParcelId(stated[1])) return stated[1];
    if (m.role === 'user') {
      const typed = extractParcelId(m.content);
      if (typed) return typed;
    }
  }
  return null;
}

function fluFromMessages(msgs) {
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i];
    if (!m || m.role !== 'assistant' || !m.content) continue;
    const set = String(m.content).match(/Future land use set to \*\*(.+?)\*\*/);
    if (set && FLU_CATEGORIES[set[1]]) return set[1];
  }
  return null;
}

async function restoreParcelFromTranscript(conv) {
  const id = parcelIdFromMessages(conv.messages || []);
  if (!id) return;
  try {
    const data = await fetchParcel(id);
    if (!data.parcels || data.parcels.length !== 1) return;
    if (activeId !== conv.id) return;          // they opened something else while it loaded
    activeParcel = data.parcels[0];
    if (data.related) activeParcel.related = data.related;
    const flu = fluFromMessages(conv.messages || []);
    if (flu) activeParcel.flu = flu;
    conv.parcel = activeParcel;                // recorded, so this only happens once
    saveHistory();
    render();
  } catch (err) { /* the conversation still opens, just without the parcel */ }
}

function openConversation(id) {
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  messages = conv.messages;
  activeParcel = conv.parcel || null;
  activeId = id;
  lastError = null;
  historyOpen = false;
  scrollToBottomNext = true;
  if (!activeParcel) restoreParcelFromTranscript(conv);
  render();
}

function deleteConversation(id, e) {
  if (e) e.stopPropagation();
  conversations = conversations.filter(c => c.id !== id);
  saveHistory();
  if (activeId === id) { messages = []; activeId = null; }
  render();
}

function clearHistory() {
  if (!confirm('Clear all saved conversations on this device? This cannot be undone.')) return;
  conversations = [];
  activeId = null;
  messages = [];
  saveHistory();
  historyOpen = false;
  render();
}

function toggleHistory(e) {
  if (e) e.stopPropagation();
  historyOpen = !historyOpen;
  kbDropdownOpen = false;
  render();
}

function relativeTime(ts) {
  if (!ts) return '';
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + (mins === 1 ? ' min ago' : ' mins ago');
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const days = Math.floor(hrs / 24);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + ' days ago';
  return new Date(ts).toLocaleDateString();
}

// One question per document category, picked at random on each page
// load so staff see the tool's range over time instead of the same
// 4 examples every visit. Doesn't reshuffle mid-session (only on load),
// so it stays stable while someone's actually using it.
const SUGGESTION_POOL = {
  'Building Guide': [
    "What forms do I need for a new mobile home set-up?",
    "What's the fee for a residential roofing permit?",
    "Does the $7,500 exemption cover a bathroom remodel?",
    "What's required for an owner-builder permit?"
  ],
  'HB 803 Memo': [
    "What changed for private provider roof inspections?",
    "What's still pending confirmation from the 2026 legislative session?",
    "Did the permit expiration rules change this year?"
  ],
  '2026 Fee Schedule': [
    "What's the fee for a new communication tower?",
    "How much is a Tier 2 site plan review?",
    "What happens when a building permit expires?"
  ],
  'Comprehensive Plan': [
    "How close can I build near a wellhead?",
    "What's the density cap for Agriculture land use?",
    "What's the setback for a road planned for multilaning?"
  ],
  'Land Development Code': [
    "What's the minimum lot size for a single-family home?",
    "What triggers a site plan review?",
    "What's the fee for a mobile home park?"
  ],
  // Whole-project walkthroughs — the questions applicants actually ask at
  // the counter, phrased the way they ask them.
  'Step-by-step': [
    "What are the steps and permits for building a pole barn house?",
    "What permits do I need to build a house, and what does each one cost?",
    "Walk me through setting up a mobile home start to finish",
    "What's the process for building a shed, and what are the dos and don'ts?"
  ]
};

function pickRandomSuggestions() {
  const categories = Object.keys(SUGGESTION_POOL);
  const picks = categories.map(cat => {
    const options = SUGGESTION_POOL[cat];
    return options[Math.floor(Math.random() * options.length)];
  });
  // shuffle so the category order isn't always the same either
  for (let i = picks.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [picks[i], picks[j]] = [picks[j], picks[i]];
  }
  return picks;
}

const SUGGESTIONS = pickRandomSuggestions();

// Auto-scrolling must never fight someone who is reading. The chat follows new
// text only while they're already at the bottom; the moment they scroll up to
// read, it leaves them where they are. Set when the user does something that
// should always jump to the bottom (asking a question, opening a conversation).
let scrollToBottomNext = false;

function isNearBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Lightweight markdown renderer — just the subset the assistant actually
// emits: headings, bullet/numbered lists, **bold**, and simple pipe tables
// (used for fee breakdowns). Everything is HTML-escaped BEFORE any markup is
// added, so nothing in a model answer can inject markup.
// Only http(s) links are ever turned into anchors, so a model answer can't
// produce a javascript: or data: link. Input is already HTML-escaped.
function safeLink(url, label) {
  // A path of our own ("/docs/…") is as safe as an absolute http link and is
  // how the assistant refers to the documents this app serves. Anything else
  // — javascript:, data:, a bare word — is left as plain text.
  const ours = /^\/[A-Za-z0-9._~\-/%?=&#]*$/.test(url);
  if (!/^https?:\/\//i.test(url) && !ours) return label;
  const target = ours ? '' : ' target="_blank" rel="noopener"';
  return `<a href="${url}"${target}>${label}</a>`;
}

function inlineMd(escaped) {
  return escaped
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    // [label](https://…) and [label](/docs/…)
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^\s)]+)\)/gi, (m, label, url) => safeLink(url, label))
    // _emphasis_ and *emphasis*, but never inside a word (file_name_here)
    .replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s.,;:!?)])/g, '$1<em>$2</em>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
    // bare URLs that aren't already inside an href
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/gi, (m, pre, url) => {
      const trailing = url.match(/[.,;:]+$/);           // don't swallow sentence punctuation
      const clean = trailing ? url.slice(0, -trailing[0].length) : url;
      return pre + safeLink(clean, clean) + (trailing ? trailing[0] : '');
    });
}

function isTableDivider(line) {
  return /^\|?[\s:|-]*-[\s:|-]*\|?$/.test(line) && line.includes('-');
}

function splitRow(line) {
  return line.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
}

// Turns the markers the answer writes — [Land Development Code, p. 115] —
// into links that open that page with the passage highlighted. A marker whose
// source and page don't match anything that was actually retrieved is left as
// plain text rather than linked to a page nobody cited.
function linkifyCitations(html, sources) {
  if (!sources || !sources.length) return html;
  return html.replace(/\[([A-Za-z0-9][A-Za-z0-9 &'’\-\.]{2,60}?)(?:,\s*pp?\.?\s*(\d+)(?:\s*[–—-]\s*(\d+))?)?\]/g, (whole, name, page, last) => {
    const key = name.trim();
    if (!DOC_LINKS[key]) return whole;
    // Prefer an indexed passage from that page — it carries the sentence to
    // highlight. Curated entries have no page behind them, so a marker citing
    // a page still opens that page, just without a highlight.
    const onPage = page && sources.find(s => s.source === key && s.id && String(s.page) === page);
    const url = onPage ? sourceViewerUrl(onPage)
      : page ? sourceViewerUrl({ source: key, page: Number(page), last: last ? Number(last) : 0, id: 'cited' })
      : sourceViewerUrl({ source: key });
    if (!url) return whole;
    return `<a class="inline-cite" href="${url}" target="_blank" rel="noopener" title="Open this page of the ${escapeHtml(key)}">${escapeHtml(whole)}</a>`;
  });
}

// ══════════════════════════════════════════════════════════════════════
// "This answer used none of the material"
//
// When a question is outside the documents the answer says so — but the nine
// retrieved passages were still listed underneath it, which reads as though
// the refusal was grounded in them. The instructions ask for a marker at the
// end of any answer that declines, or that reports the material does not
// cover the question; the marker is stripped before display and the citation
// list is suppressed. Nothing an answer actually relied on is hidden, because
// the marker is only written when it relied on nothing.
// ══════════════════════════════════════════════════════════════════════
const NO_SOURCES_MARK = /\[\[\s*NO_SOURCES\s*\]\]/gi;
// mid-stream the marker arrives a few characters at a time, so a half-written
// one at the very end is swallowed too rather than flashing on screen
const NO_SOURCES_PARTIAL = /\[\[[A-Z_\s]*\]?\s*$/i;

function declinedAnswer(text) {
  return /\[\[\s*NO_SOURCES\s*\]\]/i.test(String(text || ''));
}

function stripNoSourcesMark(text) {
  return String(text || '').replace(NO_SOURCES_MARK, '').replace(NO_SOURCES_PARTIAL, '').trimEnd();
}

function formatBubble(text, sources) {
  const lines = escapeHtml(stripNoSourcesMark(text)).split('\n');
  const out = [];
  let para = [];
  let list = null; // { tag: 'ul' | 'ol', items: [] }

  const flushPara = () => {
    if (para.length) { out.push(`<p>${inlineMd(para.join('<br>'))}</p>`); para = []; }
  };
  const flushList = () => {
    if (list) {
      out.push(`<${list.tag}>${list.items.map(i => `<li>${inlineMd(i)}</li>`).join('')}</${list.tag}>`);
      list = null;
    }
  };
  const flushAll = () => { flushPara(); flushList(); };

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();

    if (!line) { flushAll(); continue; }

    // Pipe table: a header row followed by a |---|---| divider
    if (line.includes('|') && i + 1 < lines.length && isTableDivider(lines[i + 1].trim())) {
      flushAll();
      const head = splitRow(line);
      const rows = [];
      i += 2; // skip the divider
      while (i < lines.length && lines[i].trim().includes('|')) {
        rows.push(splitRow(lines[i].trim()));
        i++;
      }
      i--; // the outer loop advances again
      out.push(
        '<table><thead><tr>' + head.map(h => `<th>${inlineMd(h)}</th>`).join('') + '</tr></thead>' +
        '<tbody>' + rows.map(r => `<tr>${r.map(c => `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('') +
        '</tbody></table>'
      );
      continue;
    }

    // Heading: "## Text", or a short line that is entirely bold
    const hashHeading = line.match(/^#{1,6}\s+(.*)$/);
    const boldHeading = line.match(/^\*\*(.+?)\*\*:?$/);
    if (hashHeading || boldHeading) {
      flushAll();
      out.push(`<h4>${inlineMd((hashHeading ? hashHeading[1] : boldHeading[1]).trim())}</h4>`);
      continue;
    }

    // List items
    const bullet = line.match(/^[-*•]\s+(.*)$/);
    const numbered = line.match(/^\d{1,2}[.)]\s+(.*)$/);
    if (bullet || numbered) {
      const tag = bullet ? 'ul' : 'ol';
      flushPara();
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push((bullet ? bullet[1] : numbered[1]).trim());
      continue;
    }

    // Continuation of the previous list item (indented wrap)
    if (list && /^\s{2,}/.test(raw)) {
      list.items[list.items.length - 1] += ' ' + line;
      continue;
    }

    flushList();
    para.push(line);
  }

  flushAll();
  return linkifyCitations(out.join(''), sources);
}

function toggleTools(e) {
