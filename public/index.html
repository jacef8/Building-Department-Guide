<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liberty County Building Dept — Permit Assistant</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#751D2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Building Dept">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
</head>
<body>
<style>
/* ══════════════════════════════════════════════════════════════════
   Liberty County Permit Assistant

   Style: Work tool (design directive 3.2) — a county app used at a
   counter all day. Quiet, fast to scan, clarity over decoration.

   Who:   Building Department staff with an applicant at the counter,
          and the public on the same tool in public mode.
   Where: a desk at the counter; a phone away from the office.
   The one thing: a correct answer with the source to show the applicant.

   Layout (directive 2.3): one screen, never a long page scroll. The
   answer is the biggest thing and scrolls in its own column; the
   controls sit in a rail beside it, and in a drawer on phones.

   CSS trap (2.3): every phone rule lives in the one media block at the
   END of this file, after the base rules, or it loses on source order.
   ══════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --bg:#F2F1EC;            /* page */
  --surface:#FFFFFF;       /* cards */
  --surface-2:#EBE9E2;     /* inputs, wells, stripes */
  --line:#D8D4C8;
  --ink:#16140F;           /* body, ~17:1 on white */
  --ink-2:#44403A;         /* secondary, ~9:1 */
  --ink-3:#625C53;         /* labels, ~6:1 */
  --maroon:#751D2C;        /* county letterhead, PANTONE 188 C */
  --maroon-head:#8C3444;
  --gold:#C1B572;          /* rules and the mark only, never text */
  --tint:#F6F3E7;
  --grid:#D3C9A2;
  --ok:#137A3F; --bad:#C62828;
  --r:16px; --r-s:12px;
  --raise:0 1px 2px rgba(0,0,0,.08),0 4px 10px -6px rgba(0,0,0,.18);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
textarea,input,select{font:inherit}
:where(a,button,input,textarea,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--maroon);outline-offset:2px;border-radius:6px}
.num,td,th{font-variant-numeric:tabular-nums}

/* ── shell ──────────────────────────────────────────────────────── */
#app{height:100dvh;display:grid;gap:10px;padding:10px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
#app>*{min-height:0}
.rail,.main,.detail{overflow:auto}
@media(min-width:1180px){
  #app{grid-template-columns:258px minmax(0,1fr) 372px}
  .header{grid-column:1/-1}
}
@media(min-width:780px) and (max-width:1179px){
  #app{grid-template-columns:230px minmax(0,1fr)}
  .header{grid-column:1/-1}
  #app>.detail{display:none}
}

/* ── header ─────────────────────────────────────────────────────── */
.header{display:flex;align-items:center;gap:12px;background:var(--maroon);
  border-radius:var(--r);padding:10px 14px;color:#fff}
.bell{width:34px;height:34px;flex:none;border-radius:9px;background:var(--gold);
  display:grid;place-items:center}
.bell svg{width:22px;height:22px;display:block}
.titles{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:rgba(255,255,255,.84)}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;display:inline-flex;align-items:center;min-height:32px;padding:0 12px;
  border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);
  font-size:12.5px;font-weight:700;white-space:nowrap}
.tools-toggle,.parcelbar{display:none}

/* ── notices ────────────────────────────────────────────────────── */
.disclaimer{border-radius:var(--r-s);padding:9px 14px;font-size:13.5px;line-height:1.45;
  background:var(--tint);border:1px solid var(--line);color:var(--ink-2);text-align:center}
.disclaimer a{color:var(--maroon);font-weight:700}
.disclaimer .short{display:none}
.foot-notice{display:none}          /* the rail carries this instead */

/* ── rail ───────────────────────────────────────────────────────── */
.rail{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--raise)}
.card>h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:800;padding:12px 14px 0;margin:0}
.card>.cbody{padding:10px 14px 14px}
.sources-strip{display:flex;flex-direction:column;gap:8px;position:relative}
.kb-toggle,.strip-btn,.parcel-link{display:flex;align-items:center;gap:9px;width:100%;
  min-height:46px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-align:left;
  text-decoration:none}
.kb-toggle:hover,.strip-btn:hover,.parcel-link:hover{background:var(--surface-2)}
.kb-toggle.open{background:var(--maroon);border-color:var(--maroon);color:#fff}
.count-badge{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink-3);
  background:var(--surface-2);border-radius:999px;padding:2px 8px}
.kb-toggle.open .count-badge{background:rgba(255,255,255,.2);color:#fff}
.chevron{font-size:9px;color:var(--ink-3)}
.kb-toggle.open .chevron{color:#fff;transform:rotate(180deg)}
.label-short{display:none}
.kb-dropdown{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.doc-chip{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  color:var(--ink-2);font-size:13px;font-weight:650;text-decoration:none}
.doc-chip:hover{background:var(--tint);color:var(--maroon)}
.doc-chip .dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--gold)}
.chip-arrow{margin-left:auto;color:var(--ink-3);font-size:12px}

/* history drops below its button rather than floating over the answer */
.history-panel{border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);
  overflow:hidden}
.hp-head{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--surface-2);
  border-bottom:1px solid var(--line);font-size:13px}
.hp-clear{margin-left:auto;background:none;border:0;color:var(--maroon);font-weight:700;font-size:12.5px}
.hp-list{max-height:290px;overflow:auto}
.hp-item{display:flex;align-items:center;gap:6px;padding:9px 11px;cursor:pointer}
.hp-item+.hp-item{border-top:1px solid var(--line)}
.hp-item:hover{background:var(--tint)}
.hp-item.active{background:var(--tint);box-shadow:inset 3px 0 0 var(--maroon)}
.hp-body{min-width:0;flex:1}
.hp-title{font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hp-meta{font-size:12px;color:var(--ink-3);margin-top:1px}
.hp-del{flex:none;width:28px;height:28px;border-radius:8px;border:0;background:none;
  color:var(--ink-3);font-size:17px;line-height:1}
.hp-del:hover{background:var(--surface-2);color:var(--bad)}
.hp-empty{padding:14px 12px;font-size:13px;color:var(--ink-3);line-height:1.45}
.rail .rail-note{font-size:12.5px;color:var(--ink-3);line-height:1.45;padding:0 2px}

/* ── main column ────────────────────────────────────────────────── */
.main{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-width:0}
.chat{overflow-y:auto;overflow-x:hidden;padding-right:2px;min-width:0}
.msg{display:flex;gap:10px;margin:0 0 12px;align-items:flex-start;min-width:0}
.msg.user{justify-content:flex-end}
.msg .avatar{display:none}
.msg.user .bubble{background:var(--maroon);color:#fff;border-radius:14px 14px 4px 14px;
  padding:9px 14px;font-weight:650;max-width:min(620px,88%)}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--raise);padding:17px 19px;width:100%;
  min-width:0;max-width:100%;overflow-wrap:anywhere}
.msg.assistant .bubble p{margin:0 0 12px;font-size:16px}
.msg.assistant .bubble p:last-child{margin-bottom:0}
.msg.assistant .bubble h4{font-size:16px;font-weight:800;margin:16px 0 6px}
.msg.assistant .bubble h4:first-child{margin-top:0}
.msg.assistant .bubble ul,.msg.assistant .bubble ol{margin:0 0 12px;padding-left:22px}
.msg.assistant .bubble li{margin:0 0 5px;font-size:16px}
.msg.assistant .bubble strong{font-weight:800}
.msg.assistant .bubble table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14.5px;
  display:block;overflow-x:auto;max-width:100%}
.msg.assistant .bubble thead,.msg.assistant .bubble tbody{display:table;width:100%}
.msg.assistant .bubble th{background:var(--maroon-head);color:#fff;font-weight:800;font-size:13px;
  text-align:left;padding:8px 10px;border:1px solid var(--grid)}
.msg.assistant .bubble td{padding:8px 10px;border:1px solid var(--grid)}
.msg.assistant .bubble tbody tr:nth-child(odd){background:var(--tint)}
.inline-cite{color:var(--maroon);font-weight:700;text-decoration:underline;
  text-underline-offset:2px;text-decoration-thickness:1px;white-space:nowrap}
.sent-files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.sent-files .f{font-size:12.5px;font-weight:700;background:var(--surface-2);
  border-radius:999px;padding:3px 10px;color:var(--ink-2)}
.msg.user .sent-files .f{background:rgba(255,255,255,.2);color:#fff}
.typing{display:flex;gap:5px;padding:4px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--maroon);opacity:.35;
  animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}

/* citations: a quiet list under the answer, never pushing it off screen */
.sources-used{margin-top:14px;border-top:1px solid var(--line);padding-top:11px;
  display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0;max-width:100%}
.sources-used>summary{list-style:none;font-size:12.5px;font-weight:800;color:var(--ink-3);
  cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:.07em}
.sources-used>summary::-webkit-details-marker{display:none}
.sources-used>summary::before{content:"▸ ";display:inline-block}
.sources-used[open]>summary::before{content:"▾ "}
@media(min-width:1180px){.sources-used{display:none}}   /* the detail column shows them */
/* min-width:0 is the point of this rule. A flex item refuses to shrink below
   its min-content width by default, and with white-space:nowrap that is the
   full source name — which pushed the whole page sideways on a phone. */
/* One source per row. As inline pills in a flex row these laid out at their
   full label width — 681px inside a 308px column — because max-width:100% was
   not clamping them, and the page scrolled sideways on a phone. A block row
   cannot do that, and the label still truncates rather than wrapping. */
.citation-tag{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;
  font-size:12.5px;font-weight:700;color:var(--maroon);background:var(--tint);
  border:1px solid var(--grid);border-radius:10px;padding:7px 11px;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citation-tag:hover{background:var(--surface-2)}

/* empty state */
.empty-state{max-width:720px;margin:0 auto;padding:22px 4px}
.empty-state .icon{display:none}
.empty-state h2{font-size:22px;font-weight:800;margin-bottom:8px}
.empty-state p{font-size:15.5px;color:var(--ink-2);margin:0 0 16px}
.suggestion-row{display:flex;flex-wrap:wrap;gap:8px}
.suggestion-chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:14px;font-weight:650;text-align:left}
.suggestion-chip:hover{background:var(--tint);color:var(--maroon);border-color:var(--grid)}

/* ── ask box ────────────────────────────────────────────────────── */
.input-bar{display:flex;gap:8px;align-items:flex-end;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--raise);padding:9px}
.input-bar textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:1px solid var(--line);
  border-radius:var(--r-s);background:var(--surface-2);color:var(--ink);padding:12px 13px;
  font-size:16px;line-height:1.4}
.input-bar .attach-btn{width:46px;height:46px;flex:none;padding:0;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surface);color:var(--maroon);
  display:grid;place-items:center}
.input-bar .attach-btn svg{width:21px;height:21px}
.input-bar .attach-btn:hover{background:var(--tint)}
.input-bar #sendBtn{min-height:46px;padding:0 20px;border:0;border-radius:var(--r-s);
  background:var(--maroon);color:#fff;font-weight:800;font-size:15px}
.input-bar #sendBtn:hover{background:var(--maroon-head)}
.input-bar #sendBtn:disabled,.input-bar .attach-btn:disabled{opacity:.55;cursor:default}
.attach-tray{display:flex;flex-wrap:wrap;gap:7px}
.attach-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 11px;font-size:12.5px}
.attach-chip .nm{font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-chip .sz{color:var(--ink-3)}
.attach-chip .rm{width:24px;height:24px;border-radius:50%;border:0;background:var(--surface-2);
  color:var(--ink-2);font-size:15px;line-height:1}
.attach-chip .rm:hover{background:var(--bad);color:#fff}
.error-banner{background:#FDECEC;border:1px solid #E9B7B7;color:#8A1C1C;border-radius:var(--r-s);
  padding:10px 13px;font-size:14px;font-weight:650}

/* ── detail column ──────────────────────────────────────────────── */
.detail{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-weight:700}
.kv dd{margin:0;font-weight:650;text-align:right;overflow-wrap:anywhere}
.stage{position:relative;background:var(--tint);border:1px solid var(--line);
  border-radius:var(--r-s);overflow:hidden}
.stage canvas{display:block;width:100%;height:300px;touch-action:none}
.stage .hint{position:absolute;left:9px;bottom:8px;background:rgba(255,255,255,.94);
  border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;
  font-weight:700;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:10px;font-size:12.5px;
  font-weight:700;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;
  vertical-align:-1px}
.note{font-size:12.5px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}
.srcs{display:flex;flex-direction:column;gap:6px}
.srcs a,.srcs span.flat{display:block;border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;font-size:13px;font-weight:700;color:var(--maroon);text-decoration:none;
  background:var(--surface)}
.srcs a:hover{background:var(--tint)}
.srcs .where{display:block;font-weight:600;color:var(--ink-3);font-size:12px;margin-top:1px}
.empty-detail{font-size:13px;color:var(--ink-3);line-height:1.45}

/* parcel on the counter */
.parcel-bar{display:flex;flex-direction:column;gap:9px}
.pb-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
  color:var(--maroon)}
.pb-id{font-size:15px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.pb-detail{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.pb-flu{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:13px}
.pb-flu label{font-weight:700;color:var(--ink-3);width:100%}
.pb-flu select{flex:1;min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);padding:0 9px;font-size:14px;font-weight:650}
.pb-flu a{color:var(--maroon);font-weight:700;white-space:nowrap}
.pb-clear{min-height:38px;padding:0 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-weight:700;font-size:13px;align-self:flex-start}
.pb-clear:hover{background:var(--surface-2);color:var(--bad)}

/* ── staff sign-in ──────────────────────────────────────────────── */
.signin{max-width:380px;margin:52px auto;padding:0 20px;text-align:center}
.signin p{color:var(--ink-2);font-size:15px;line-height:1.5;margin-bottom:18px}
.signin input{width:100%;min-height:48px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--surface);padding:0 14px;font-size:16px;margin-bottom:10px}
.signin button{width:100%;min-height:48px;border:0;border-radius:var(--r-s);background:var(--maroon);
  color:#fff;font-weight:800;font-size:16px}

/* ══ phones: ALL phone rules live here, after the base rules ══════ */
@media(max-width:779px){
  #app{height:100dvh;grid-template-rows:auto minmax(0,1fr);padding:8px;gap:8px}
  .header{padding:9px 12px}
  .header h1{font-size:17px}
  .eyebrow,.badge{display:none}
  .tools-toggle{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;
    min-width:44px;min-height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.34);
    background:transparent;color:#fff}
  .tools-toggle svg{width:21px;height:21px}
  .disclaimer .long{display:none}
  .disclaimer .short{display:inline}

  /* flex, not grid: as a grid the first track collapsed to 0 and the
     notice sat on top of the answer */
  .main{display:flex;flex-direction:column;gap:8px}
  .main>.disclaimer{flex:none}
  .main>.chat{flex:1 1 auto;min-height:0}
  .main>.input-bar,.main>.attach-tray,.main>.error-banner{flex:none}

  /* the rail and the detail panel become drawers */
  #app>.rail{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(340px,88vw);
    background:var(--surface);border-radius:var(--r) 0 0 var(--r);padding:12px;overflow:auto;
    transform:translateX(105%);transition:transform .22s ease;
    box-shadow:-10px 0 24px -14px rgba(0,0,0,.5)}
  #app>.rail.open{transform:none}
  #app>.detail{display:none}
  #app>.detail.open{display:flex;position:fixed;z-index:40;left:0;right:0;bottom:0;top:auto;
    max-height:84dvh;background:var(--surface);border-radius:var(--r) var(--r) 0 0;
    padding:12px;overflow:auto}
  .scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.55)}

  .parcelbar{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
    color:var(--ink);font-size:14px;font-weight:700;text-align:left;flex:none}
  .parcelbar .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .parcelbar .go{margin-left:auto;color:var(--maroon);font-weight:800;white-space:nowrap}

  .msg.assistant .bubble{padding:15px 16px}
  .msg.assistant .bubble p,.msg.assistant .bubble li{font-size:16px}
  .empty-state{padding:12px 2px}
  .empty-state h2{font-size:19px}
  .suggestion-chip{font-size:13.5px}
  .stage canvas{height:290px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

<script>
// ══════════════════════════════════════════════════════════════════════
// KNOWLEDGE BASE — extracted from the Building Department Guide (v3, rev.
// July 2026) and the HB 803 Legislative Update Memo. Each entry is one
// retrievable chunk with a source label so answers can be cited.
// ══════════════════════════════════════════════════════════════════════
// Source documents behind each knowledge-base entry. County-hosted
// documents link straight to the official site (always current, no
// duplicate to maintain); internal-only documents are served as static
// files from this same app's /docs folder.
const DOC_LINKS = {
  'Building Guide': '/docs/building-department-guide.pdf',
  'HB 803 Memo': '/docs/hb803-legislative-memo.pdf',
  '2026 Fee Schedule': '/docs/2026-fee-schedule.pdf',
  'Comprehensive Plan': '/docs/comprehensive-plan.pdf',
  'Land Development Code': '/docs/land-development-code.pdf',
  'Permit Eligibility Guide': '/docs/permit-eligibility-guide-2026.pdf',
  'Permit Coverage Reference': '/docs/permit-coverage-reference.pdf',
