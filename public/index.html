  detailOpen = false;
  toolsOpen = !toolsOpen;
  if (!toolsOpen) { kbDropdownOpen = false; historyOpen = false; }
  render();
}

function toggleKbDropdown(e) {
  if (e) e.stopPropagation();
  kbDropdownOpen = !kbDropdownOpen;
  historyOpen = false;   // the two panels overlap — opening one closes the other
  render();
}

// Close the dropdown / history panel if the user clicks anywhere outside them
document.addEventListener('click', (e) => {
  if (!kbDropdownOpen && !historyOpen && !toolsOpen && !detailOpen) return;
  if (e.target.closest('.kb-toggle') || e.target.closest('.kb-dropdown') ||
      e.target.closest('.strip-btn') || e.target.closest('.history-panel') ||
      e.target.closest('.tools-toggle') || e.target.closest('.sources-strip') ||
      e.target.closest('.rail') || e.target.closest('.detail') ||
      e.target.closest('.parcelbar')) return;
  detailOpen = false;
  kbDropdownOpen = false;
  historyOpen = false;
  toolsOpen = false;
  render();
});

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
}

function askSuggestion(btn) {
  document.getElementById('questionInput').value = btn.textContent;
  sendQuestion();
}

async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  // A file on its own is a valid request — "have a look at this".
  if ((!question && !pendingAttachments.length) || isLoading) return;

  // Hand the files to this send and clear the tray, so they can't be sent
  // twice if the next question follows quickly.
  const outgoing = pendingAttachments;
  pendingAttachments = [];

  lastError = null;
  messages.push({
    role: 'user',
    content: question || 'Please look at the attached file and tell me what it shows.',
    // Only names are kept on the message — never the file data.
    files: outgoing.map(a => ({ name: a.name, kind: a.kind }))
  });
  isLoading = true;
  scrollToBottomNext = true;   // always show the question they just asked
  render();

  // A bare parcel number pulls the property up. A question with a parcel
  // number inside it ("can 01-9S-3W-0000-1000 be split?") quietly sets that
  // parcel first, then answers the question against it.
  const embedded = outgoing.length ? null : extractParcelId(question);
  if (embedded && looksLikeParcelId(question)) {
    await runParcelLookup(question);
  } else if (!outgoing.length && !embedded && looksLikePropertySearch(question)
             && await runPropertySearch(question)) {
    /* the search found properties and has answered */
  } else {
    if (embedded) await loadParcel(embedded);
    await runKnowledgeBaseQuestion(question, outgoing);
  }

  isLoading = false;
  input.value = '';
  focusInputNext = true;
  persistActive();
  render();
}

async function fetchParcel(parcelId) {
  const response = await fetch("/api/parcel", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ parcelId })
  });
  if (!response.ok) {
    const errBody = await response.json().catch(() => ({}));
    throw new Error(errBody.error || `Server responded with status ${response.status}`);
  }
  const data = await response.json();
  PARCEL_META = data.meta || PARCEL_META;
  return data;
}

// Sets the active parcel without saying anything — used when a parcel number
// arrives inside a question.
async function loadParcel(parcelId) {
  try {
    const data = await fetchParcel(parcelId);
    if (data.parcels && data.parcels.length === 1) activeParcel = data.parcels[0];
  } catch (err) {
    /* the question still gets answered without the parcel */
  }
}

async function runParcelLookup(parcelId) {
  try {
    const data = await fetchParcel(parcelId);
    if (data.parcels && data.parcels.length === 1) activeParcel = data.parcels[0];
    const answer = formatParcelResult(data, parcelId);
    messages.push({
      role: 'assistant',
      content: answer,
      sources: [{ source: 'Liberty County Tax Roll', section: `Florida Dept. of Revenue, ${data.meta && data.meta.assessmentYear ? data.meta.assessmentYear + ' roll' : 'assessment roll'}` }]
    });
  } catch (err) {
    lastError = "Couldn't reach the parcel lookup (" + err.message + "). Try the \"Look up a parcel\" link above to search the Property Appraiser's site instead.";
  }
}

// Returns true only if the search actually found property — otherwise the
// question carries on to the knowledge base as though this never ran.
async function runPropertySearch(term) {
  try {
    const data = await fetchParcel(term);
    if (!data.parcels || !data.parcels.length) return false;
    if (data.parcels.length === 1) activeParcel = data.parcels[0];
    messages.push({
      role: 'assistant',
      content: formatParcelResult(data, term),
      sources: [{ source: 'Liberty County Tax Roll', section: `Florida Dept. of Revenue, ${data.meta && data.meta.assessmentYear ? data.meta.assessmentYear + ' roll' : 'assessment roll'}` }]
    });
    return true;
  } catch (err) {
    return false;
  }
}

// A citation should land the reader on the sentence. Where the passage came
// from an indexed document we know its page and its text, so the link opens
// the in-app page viewer, which highlights that passage. Curated entries have
// no page behind them, so they open the document itself.
function sourceViewerUrl(s) {
  const doc = DOC_LINKS[s.source];
  if (!doc) return null;
  if (!s.page || !s.id) return doc;              // curated entry — no page to land on
  const probe = (s.text || '').replace(/\s+/g, ' ').trim().split(' ').slice(0, 14).join(' ');
  return '/source.html?doc=' + encodeURIComponent(doc)
    + '&page=' + s.page
    + (s.last && s.last > s.page ? '&last=' + s.last : '')
    + '&label=' + encodeURIComponent(s.source)
    + (probe ? '&q=' + encodeURIComponent(probe) : '');
}

function clearActiveParcel() {
  activeParcel = null;
  render();
}

// Staff read the category off the Future Land Use Map and set it here. It
// stays with the parcel for the rest of the conversation, and every density
// answer after that is computed from it.
async function setParcelFlu(category) {
  if (!activeParcel) return;
  activeParcel.flu = category || null;
  if (category) {
    const cat = FLU_CATEGORIES[category];
    const acres = activeParcel.acres || 0;
    const ceiling = acres && cat.maxPerAcre > 0
      ? ` At ${acresText(activeParcel)}, the ceiling is about ${Math.floor(acres * cat.maxPerAcre)} dwelling unit(s).`
      : '';
    messages.push({
      role: 'assistant',
      content: `Future land use set to **${category}** for parcel ${activeParcel.id}.\n\n${cat.density.charAt(0).toUpperCase() + cat.density.slice(1)}.${ceiling}\n\n${cat.note}\n\n_Read off the Future Land Use Map by staff, not from the tax roll. Everything from here is answered for this parcel as ${category}, until you change it or press Clear._`,
      sources: [{ source: 'Comprehensive Plan', section: 'Policy 1-2 — Future Land Use Map categories' }],
    });
    scrollToBottomNext = true;
  }
  persistActive();
  render();

  // An answer given before the category was set was answered without it, and
  // it is still sitting there on screen. Ask it again so the visible answer
  // matches what the tool now knows.
  if (category) await reaskLastQuestion(category);
}

// The last real question — not a parcel number or a name search, both of which
// are lookups rather than questions.
function lastRealQuestion() {
  for (let i = messages.length - 1; i >= 0; i--) {
    const m = messages[i];
    if (m.role !== 'user' || !m.content) continue;
    if (looksLikeParcelId(m.content) || extractParcelId(m.content) === m.content) return null;
    if (looksLikePropertySearch(m.content)) return null;
    return m.content;
  }
  return null;
}

async function reaskLastQuestion(category) {
  const question = lastRealQuestion();
  if (!question || isLoading) return;
  messages.push({ role: 'user', content: question, replay: category });
  isLoading = true;
  scrollToBottomNext = true;
  render();
  await runKnowledgeBaseQuestion(question, []);
  isLoading = false;
  persistActive();
  render();
}

async function runKnowledgeBaseQuestion(question, outgoing) {
  try {
    const files = outgoing || [];
    const isGuide = isGuideQuestion(question);

    // A short follow-up ("what about commercial?", "how much is that?")
    // carries almost no retrievable keywords on its own, so fold in the
    // previous question when searching the knowledge base.
    const priorAsks = messages.filter(m => m.role === 'user').slice(0, -1);
    const retrievalBase = (tokenize(question).length < 5 && priorAsks.length && !files.length)
      ? priorAsks[priorAsks.length - 1].content + ' ' + question
      : question;

    // Whole-project questions touch many sections at once, so they get a
    // wider net; single lookups stay tight to avoid diluting the context.
    await loadReferenceIndex();   // full LDC / Comp Plan text, fetched once
    const chunkScores = new Map();
    const relevantChunks = retrieveChunks(expandQuery(retrievalBase, isGuide), isGuide ? 18 : 9, chunkScores);
    // Everything retrieved is sent to the model; only the passages that
    // genuinely matched are listed to the reader as the basis of the answer.
    const shownSources = citableSources(relevantChunks, chunkScores, question);
    let contextText = relevantChunks.length
      // A passage that runs over a page break names both pages, so a rule on
      // the second one is not cited to the page before it.
      ? relevantChunks.map(c => `[${c.source} \u2014 ${c.section}${c.page ? (c.last && c.last > c.page ? `, pages ${c.page}\u2013${c.last}` : `, page ${c.page}`) : ''}]\n${c.text}`).join('\n\n---\n\n')
      : '';

    // The parcel on the counter goes in front of the reference material, so a
    // question like "can this be split?" is answered for that property.
    if (activeParcel) {
      contextText = parcelContextBlock(activeParcel) + (contextText ? '\n\n---\n\n' + contextText : '');
    }

    // Prior turns so follow-up questions make sense. Only the plain text is
    // sent \u2014 never the citations or any local metadata.
    const priorTurns = messages.slice(0, -1).slice(-MAX_TURNS_SENT)
      .map(m => ({ role: m.role, content: m.content }));

    // The instructions/guardrails live on the server and are chosen by mode
    // (public vs. staff) \u2014 the browser only sends the question, the
    // retrieved reference material, and the conversation so far.
    const response = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        context: contextText,
        history: priorTurns,
        intent: isGuide ? 'guide' : 'single',
        stream: STREAMING_ENABLED,
        attachments: files.map(a => ({ name: a.name, media_type: a.mediaType, data: a.data })),
        mode: IS_STAFF ? 'staff' : 'public'
      })
    });

    if (!response.ok) {
      const errBody = await response.json().catch(() => ({}));
      throw new Error(errBody.error || `Server responded with status ${response.status}`);
    }

    const contentType = response.headers.get('content-type') || '';
    if (contentType.includes('text/event-stream') && response.body) {
      await consumeAnswerStream(response, relevantChunks, shownSources);
    } else {
      // Non-streaming fallback, in case a proxy collapses the stream.
      const data = await response.json();
      const answer = data.answer || "I didn't get a usable response \u2014 try rephrasing the question.";
      messages.push({ role: 'assistant', content: answer, sources: relevantChunks, shown: shownSources });
    }
  } catch (err) {
    lastError = "Couldn't reach the assistant backend (" + err.message + "). If you're running this locally, make sure the proxy server is started (npm start) and ANTHROPIC_API_KEY is set.";
  }
}

// Reads the server's event stream and grows the answer bubble in place.
// A full render() per token would rebuild the whole page and fight the
// scroll position, so only the one bubble's contents are rewritten, and no
// more often than every 60ms — enough to read as continuous typing without
// re-parsing the markdown on every character.
async function consumeAnswerStream(response, sources, shown) {
  const msg = { role: 'assistant', content: '', sources, shown: shown || sources, streaming: true };
  messages.push(msg);
  render();

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let lastPaint = 0;

  const paint = (force) => {
    const now = Date.now();
    if (!force && now - lastPaint < 60) return;
    lastPaint = now;
    const bubble = document.getElementById('streamingBubble');
    if (!bubble) return;
    // Check BEFORE growing the bubble — afterwards the new text has already
    // moved the bottom out from under them.
    const chat = document.getElementById('chatArea');
    const follow = chat ? isNearBottom(chat) : false;
    bubble.innerHTML = formatBubble(msg.content, msg.sources);
    if (chat && follow) chat.scrollTop = chat.scrollHeight;
  };

  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        const dataLine = frame.split('\n').find(l => l.startsWith('data:'));
        if (!dataLine) continue;
        let evt;
        try { evt = JSON.parse(dataLine.slice(5).trim()); } catch (e) { continue; }
        if (evt.error) { lastError = evt.error; continue; }
        if (typeof evt.text === 'string') { msg.content += evt.text; paint(false); }
      }
    }
  } finally {
    // Whatever arrived before an interruption is kept rather than discarded.
    paint(true);
    msg.streaming = false;
    if (!msg.content) {
      msg.content = "I didn't get a usable response — try rephrasing the question.";
    }
  }
}

// ══════════════════════════════════════════════════════════════════════
// Staff sign-in (shared office password) — the server decides the mode from
// an HttpOnly cookie; this UI only appears on the /staff route.
// ══════════════════════════════════════════════════════════════════════
function renderStaffLogin(errMsg) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div class="bell"><svg viewBox="0 0 24 24" width="24" height="24" fill="#751D2C" aria-hidden="true"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></div>
      <div class="titles">
        <div class="eyebrow">Liberty County Building Dept</div>
        <h1>Staff Sign-In</h1>
      </div>
    </div>
    <div class="signin">
      <p>Enter the office password to use the internal staff assistant.</p>
      ${errMsg ? `<div class="error-banner" style="margin-bottom:14px">${escapeHtml(errMsg)}</div>` : ''}
      <input id="staffPw" type="password" placeholder="Office password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')staffLogin()" />
      <button onclick="staffLogin()">Sign in</button>
      <p style="margin-top:20px;font-size:13.5px"><a href="/" style="color:var(--maroon);font-weight:700">Continue to the public version →</a></p>
    </div>`;
  const el = document.getElementById('staffPw');
  if (el) el.focus();
}

async function staffLogin() {
  const el = document.getElementById('staffPw');
  const pw = el ? el.value : '';
  if (!pw) return;
  try {
    const r = await fetch('/api/staff-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (r.ok) { IS_STAFF = true; render(); }
    else {
      const e = await r.json().catch(() => ({}));
      renderStaffLogin(e.error || 'Sign-in failed. Please try again.');
    }
  } catch (err) {
    renderStaffLogin('Could not reach the server. Please try again.');
  }
}

async function staffLogout() {
  try { await fetch('/api/staff-logout', { method: 'POST' }); } catch (e) {}
  location.href = '/';
}

// The version is decided purely by the URL: only the /staff route can be the
// staff version. Every other URL is always public, no matter what cookie the
// browser is holding.
async function init() {
  loadHistory();
  loadReferenceIndex();   // warm the LDC / Comp Plan index in the background
  if (ON_STAFF_ROUTE) {
    try {
      const r = await fetch('/api/session');
      if (r.ok) {
        const s = await r.json();
        IS_STAFF = !!s.staff;
        STAFF_CONFIGURED = !!s.staffConfigured;
      }
    } catch (e) { /* fall through to the sign-in screen */ }
    if (!IS_STAFF) { renderStaffLogin(); return; }
  } else {
    IS_STAFF = false; // public URL — never staff, regardless of login state
  }

  // Staff can always attach files; the public page only if the server allows it.
  if (IS_STAFF) {
    UPLOADS_ENABLED = true;
  } else {
    try {
      const c = await fetch('/api/config');
      if (c.ok) UPLOADS_ENABLED = !!(await c.json()).publicUploads;
    } catch (e) { /* leave uploads off if the check fails */ }
  }

  render();
}

init();
</script>

<!-- ── PWA: service worker (offline + auto-update) ─────────────────── -->
<script>
(function () {
  // Register the service worker (required for installability).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function (e) {
        console.warn('SW registration failed:', e);
      });
    });
    // When a new service worker takes control (after a deploy), reload once so
    // the installed app can never get stuck on a stale cached page.
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }

})();
</script>

<script type="module">
/* ══════════════════════════════════════════════════════════════════
   The site diagram, and the easing on the answer column.

   Kept in a module of its own, separate from the app's main script, for
   two reasons: the main script is a classic script that the regression
   suites load into a sandbox, and a top-level import would break every
   one of them; and if this module ever fails to load, the tool carries
   on working without a diagram instead of going down with it.

   Why 3D is here at all (directive 2.10 — no 3D unless it does a real
   job): "20 feet from the line" and "200 feet from the well" are numbers
   nobody can picture. Drawn against each other at one scale, a 200 ft
   radius visibly swallows a one-acre lot, which is the whole of the
   Plan-versus-Code wellhead problem in a single glance.
   ══════════════════════════════════════════════════════════════════ */
import * as THREE from '/vendor/three.module.js';
import Lenis from '/vendor/lenis.mjs';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── the answer column eases instead of jumping ─────────────────────
   This is the whole motion budget for a work tool. Nothing else on the
   page animates, and under reduced motion nothing here runs at all. */
window.smoothThread = (() => {
  let lenis = null, attached = null;
  return {
    attach(el) {
      if (reduced || !el || el === attached) return;
      if (lenis) { lenis.destroy(); lenis = null; }
      attached = el;
      lenis = new Lenis({ wrapper: el, content: el, duration: 0.7 });
      const raf = (t) => { if (lenis) { lenis.raf(t); requestAnimationFrame(raf); } };
      requestAnimationFrame(raf);
    },
  };
})();

/* ── the diagram ─────────────────────────────────────────────────── */
window.siteDiagram = (() => {
  const SQFT_PER_ACRE = 43560;
  const SETBACK = 20;          // Residential (Low Density), all four yards
  const WELL_RADIUS = 200;     // the zone of exclusion in the Code

  let renderer, scene, camera, canvas, ro;
  let yaw = -0.62, pitch = 0.92, dist = 500;
  let drawnFor = null;

  const draw = () => { if (renderer) renderer.render(scene, camera); };

  function place() {
    camera.position.set(
      dist * Math.sin(pitch) * Math.sin(yaw),
      dist * Math.cos(pitch),
      dist * Math.sin(pitch) * Math.cos(yaw));
    camera.lookAt(0, 0, 0);
  }

  function fit() {
    if (!canvas) return;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    place(); draw();
  }

  function build(parcel) {
    const acres = Number(parcel.acres) || 0;
    const side = Math.sqrt(acres * SQFT_PER_ACRE);        // a square of the recorded area
    const inner = Math.max(side - SETBACK * 2, 0);
    const living = Number(parcel.liv) || 0;

    scene = new THREE.Scene();
    scene.background = new THREE.Color('#F6F3E7');
    scene.add(new THREE.HemisphereLight('#ffffff', '#cfc9b4', 2.1));
    const sun = new THREE.DirectionalLight('#ffffff', 1.5);
    sun.position.set(-160, 260, 120);
    scene.add(sun);

    const flat = (geo, color, y, opacity) => {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color, transparent: opacity !== undefined, opacity: opacity ?? 1, side: THREE.DoubleSide,
      }));
      m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m;
    };
    const outline = (w, d, color, y) => {
      const h = w / 2, k = d / 2;
      scene.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-h, y, -k), new THREE.Vector3(h, y, -k),
          new THREE.Vector3(h, y, k), new THREE.Vector3(-h, y, k), new THREE.Vector3(-h, y, -k)]),
        new THREE.LineBasicMaterial({ color })));
    };

    // The well sits a quarter of the way in from a corner — its true
    // position is not on the tax roll, and the note under the diagram says
    // so. The radius is measured FROM THE WELL, so it is centred there and
    // not on the lot; on a lot this size that difference decides which
    // corners can be built on.
    const wellAt = { x: side * 0.25, z: -side * 0.17 };

    const disc = flat(new THREE.CircleGeometry(WELL_RADIUS, 96), '#2E6E8E', 0.1, 0.22);
    disc.position.set(wellAt.x, 0.1, wellAt.z);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(WELL_RADIUS - 1.4, WELL_RADIUS, 96),
      new THREE.MeshBasicMaterial({ color: '#2E6E8E' }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(wellAt.x, 0.2, wellAt.z);
    scene.add(ring);

    flat(new THREE.PlaneGeometry(side, side), '#EDE7D2', 0.3);
    outline(side, side, '#8C7B3F', 0.5);
    if (inner > 0) {
      flat(new THREE.PlaneGeometry(inner, inner), '#FFFFFF', 0.4);
      outline(inner, inner, '#8C3444', 0.6);
    }

    const cells = Math.max(2, Math.round(side / 20));     // a 20 ft grid to read scale by
    const grid = new THREE.GridHelper(side, cells, '#C9C1A6', '#DCD6C2');
    grid.position.y = 0.35; scene.add(grid);

    if (living > 0) {
      const w = Math.sqrt(living * 1.45), d = living / w;   // a plausible rectangle of the recorded area
      const house = new THREE.Mesh(new THREE.BoxGeometry(w, 11, d),
        new THREE.MeshLambertMaterial({ color: '#751D2C' }));
      house.position.set(-side * 0.1, 5.9, side * 0.12);
      scene.add(house);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.78, 7, 4),
        new THREE.MeshLambertMaterial({ color: '#5E1723' }));
      roof.position.set(house.position.x, 14.9, house.position.z);
      roof.rotation.y = Math.PI / 4;
      scene.add(roof);
    }

    const well = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 16, 20),
      new THREE.MeshLambertMaterial({ color: '#2E6E8E' }));
    well.position.set(wellAt.x, 8, wellAt.z);
    scene.add(well);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(5, 18, 14),
      new THREE.MeshLambertMaterial({ color: '#1F4F68' }));
    cap.position.set(wellAt.x, 17, wellAt.z);
    scene.add(cap);

    dist = Math.max(360, side * 2.4);
    camera = new THREE.PerspectiveCamera(42, 1, 1, 6000);
    place();

    // every figure under the diagram says where it came from
    const note = document.getElementById('siteNote');
    if (note) {
      const buildable = Math.round(inner * inner);
      const radiusAcres = (Math.PI * WELL_RADIUS * WELL_RADIUS / SQFT_PER_ACRE).toFixed(1);
      note.textContent =
        `Lot drawn as a square of the ${typeof acresText === 'function' ? acresText(parcel) : acres + ' acres'} on the tax roll — the roll carries area, `
        + `not dimensions, so the shape and the position of the house and well are approximate. `
        + `The 20 ft setbacks and the 200 ft radius are to scale: ${buildable.toLocaleString()} sq ft `
        + `buildable inside the setbacks, against ${radiusAcres} acres covered by the radius.`;
    }
  }

  function wire() {
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId);
    });
    const stop = (e) => { dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} };
    canvas.addEventListener('pointerup', stop);
    canvas.addEventListener('pointercancel', stop);
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      yaw -= (e.clientX - lastX) * 0.006;
      pitch = Math.min(1.45, Math.max(0.22, pitch - (e.clientY - lastY) * 0.005));
      lastX = e.clientX; lastY = e.clientY; place(); draw();
    });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      dist = Math.min(dist * 2.4, Math.max(dist * 0.4, dist + e.deltaY * 0.8));
      place(); draw();
    }, { passive: false });
  }

  return {
    sync(parcel) {
      const el = document.getElementById('siteCanvas');
      if (!el || !parcel || !(Number(parcel.acres) > 0)) {
        drawnFor = null;
        if (ro) { ro.disconnect(); ro = null; }
        return;
      }
      // render() replaces the DOM, so the canvas is a new element each time
      const sameParcel = drawnFor === parcel.id;
      canvas = el;
      if (!renderer || renderer.domElement !== canvas) {
        if (renderer) renderer.dispose();
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        wire();
      }
      if (!sameParcel || !scene) {
        yaw = -0.62; pitch = 0.92;
        build(parcel);
        drawnFor = parcel.id;
      } else {
        build(parcel);          // the DOM was replaced; the note needs rewriting
      }
      if (ro) ro.disconnect();
      ro = new ResizeObserver(fit);
      ro.observe(canvas);
      fit();
    },
  };
})();
</script>
