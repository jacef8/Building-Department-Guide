const KNOWLEDGE_BASE = [
  // ── Inspections (Permit Coverage & Inspections Reference, Part 2) ────
  // Additional/Re-Inspection fees live in the "Inspection Fees" entry under
  // the fee schedule section below.
  { source: "Permit Coverage Reference", section: "Inspections — What Is Documented", page: 1, text:
    "The inspections documented in the department's permit materials are: (1) Mobile Home Set-Up — the block, anchor, and tie-down inspection, which is the entirety of what the $300.00 set-up permit covers. (2) Roofing under the third-party path — roof deck nailing and/or secondary water barrier, verified by a licensed third-party inspector on the Roof Inspection Affidavit, with photographs of each plane of the roof showing the permit number or property address. (3) New construction first inspection — cannot be scheduled until the Notice of Commencement has been recorded with the Clerk of Court and posted at the job site, which is required when job value exceeds $2,500. (4) New construction final inspection — required before a Certificate of Occupancy is issued, and a confirmed 911 address must also be on file before the CO." },
  { source: "Permit Coverage Reference", section: "Inspections — The Schedule Comes From the Building Department", page: 2, text:
    "The items above are the only inspections recorded in the department's written materials. Do NOT state, list, or invent a full inspection sequence for a project. The order and number of inspections a permit requires — footing, slab, framing, trade rough-ins, insulation, final — is set by the building official and is not contained in these documents. If someone asks what inspections their project will need, give only the documented items above and tell them the Liberty County Building Department will provide the inspection schedule for their specific project. Staff should confirm the sequence with the building official rather than quoting one from memory." },

  // ── Permit coverage: what each permit does and does not include ──────
  // Added 2026-09-15. Page numbers verified against Building_Department_Guide_v3
  // (v3 and v3_1 paginate identically for these sections).
  // NOTE: the septic authority in the Mobile Homes and Accessory Buildings
  // entries is DEP, not the Health Department. The v3 guide reverted to the old
  // wording; the correction confirmed 2026-08-04 is kept here.
  { source: "Permit Coverage Reference", section: "I. New Construction — Permit Coverage", page: 1, text:
    "Covers the structural shell — foundation, framing, exterior walls, and structural roof framing, including the roof covering itself. Roofing is included in this permit; a separate Roofing Permit is not required when the roof is installed as part of new construction. Does NOT cover electrical, plumbing, HVAC/mechanical, or gas work — each requires its own trade permit." },
  { source: "Permit Coverage Reference", section: "II. Electrical — Permit Coverage", page: 1, text:
    "Covers the wiring, panel, and connections for the specific scope listed (new service, upgrade, outlets/switches, solar, or generator). Does NOT cover the structure the wiring is installed in. A generator installation also requires a separate Gas permit if it is propane- or natural-gas-fed." },
  { source: "Permit Coverage Reference", section: "III. Renovations — Permit Coverage", page: 1, text:
    "A renovation or remodel trade permit covers the specific trade work listed — plumbing, gas, mechanical, or windows & siding. A renovation permit does NOT cover structural changes needed to accommodate the trade work (e.g., removing or altering load-bearing walls) — that requires a separate building permit in addition to the trade permit." },
  { source: "Permit Coverage Reference", section: "IV. Mobile Homes — Permit Coverage", page: 1, text:
    "Covers the blocking, anchoring, and tie-down inspection only. Does NOT cover the electrical hookup from the power pole to the home (requires a separate Residential Electrical permit) or the plumbing/septic connection. Septic is permitted by the Florida Department of Environmental Protection (DEP), NOT the Health Department — never send an applicant to the Health Department for septic." },
  { source: "Permit Coverage Reference", section: "V. Roofing Permit — Permit Coverage (Resolved)", page: 1, text:
    "This permit applies ONLY to re-roofing and roof repair on an existing structure, priced by square footage. Roofing installed as part of NEW CONSTRUCTION is covered under the New Construction permit (Section I) — do not charge a separate Roofing Permit fee for a roof going onto a brand-new building. This distinction was explicitly resolved and is settled guidance, not pending." },
  { source: "Permit Coverage Reference", section: "VI. Accessory Buildings — Permit Coverage", page: 1, text:
    "An accessory building permit covers the accessory building structure itself. NOT included in an accessory building permit: any plumbing installed inside (sink, toilet, water connection — requires a septic permit from the Florida Department of Environmental Protection (DEP), not the Health Department) or any electrical (requires a separate Electrical permit)." },
  { source: "Permit Coverage Reference", section: "VII. Comprehensive Plan Review — Permit Coverage", page: 1, text:
    "A site plan approval (Comprehensive Plan Review / site plan review) covers approval of the land use and site layout itself — setbacks, parking, drainage, and similar. A site plan approval does NOT replace, cover, or substitute for a building permit — a separate building permit is still required before construction begins." },
  { source: "Permit Coverage Reference", section: "VIII. Miscellaneous — Permit Coverage (Pools & Decks)", page: 1, text:
    "Swimming Pool permit covers the pool structure and required safety barrier only. Decks and Ramps permit covers the structure only. Neither covers electrical — pool electrical bonding/wiring requires a separate Electrical permit and, per FS 489.103(6), must be done by a licensed contractor (no owner-builder exception for pools); deck lighting/outlets also need their own Electrical permit." },
  { source: "Building Guide", section: "Structure Fee Rules — Rule 1 (Same-Category Modification)", page: 12, text:
    "When a structure has a permit on file that reached final inspection and closed out — even years ago — and it is now being modified into a HIGHER tier within the same fee-schedule category rather than built new, charge 50% of the fee that would apply if the resulting structure were being permitted for the first time. Example: a roofing addition that pushes a home over 1,000 sq ft ($100 new-build rate) = $50 modification fee. Same-tier expansions are FREE: if a permitted structure is enlarged but stays within the same size tier (e.g. a 200 sq ft shed enlarged to 400 sq ft, both in the same tier), there is no fee. IMPORTANT — enclosing an existing permitted open accessory building is NOT priced under this rule: it has its own flat fee of $50.00 (\"Accessory Building — Enclosing an existing permitted open structure\"), not 50% of the $150 enclosed rate. Rule 1 does not apply if there is no finaled permit on file for the existing structure — that is treated as unpermitted work instead." },
  { source: "Building Guide", section: "Structure Fee Rules — Rule 2 (Change to a Different Structure Type)", page: 12, text:
    "When an already-permitted structure is converted or turned into a different type — for example a barn, shop, or other accessory building turned into a house, living space, or commercial use — charge the FULL permit fee for the new type. Do NOT subtract or credit what was paid on the original permit. Examples: 800 sq ft barn to a house at $0.75/sq ft = $600.00; 800 sq ft barn to retail at the $0.85/sq ft commercial rate = $680.00. Zoning must approve the new use first. This applies only to a change of type; upgrades within the same type still follow Rule 1, and enclosing a permitted open accessory building is still $50.00." },

  // ── Counter procedure ────────────────────────────────────────────────
  // The order of operations staff actually walk applicants through. Added
  // July 2026 from the Clerk's Office written guidance, because the printed
  // Building Guide documents each permit on its own but never states the
  // Planning & Zoning -> Building Permit sequence — so answers about a whole
  // project were skipping the first step applicants have to take.
  { source: "Office Procedure", section: "Step 1 — Planning & Zoning Permit (before any building permit)", text:
    "Every new construction project starts with a Planning & Zoning Permit, not the building permit. The property OWNER must come into the Clerk's Office in person to apply. Once submitted, the application goes to the Apalachee Regional Planning Council (ARPC) for review, which checks the proposed project against all applicable codes — land use, zoning, setbacks, and lot standards — before any money is spent on plans or construction. Required to apply: (1) a completed application, available in the Clerk's Office or on the county's Building Department page at https://libertycountyfl.org/growth-management/building-department/ ; (2) a copy of the property deed — the Clerk's Office can help print this; (3) a site plan, which may be hand-drawn on a blank sheet of paper, showing the location of all existing and proposed structures including the new home, the size of the home, the power pole, the septic system, the driveway, and any other improvements. Staff can help applicants with the site plan. The Planning & Zoning Permit fee is $100.00. IMPORTANT — that $100.00 IS the Tier 1 Site Plan Review / Tier 1 Application Review fee: it is ONE single $100.00 charge, not two. Never list a Planning & Zoning Permit and a Tier 1 Site Plan Review as separate line items in a fee table, and never add $100 twice for the same project. The building permit application cannot move forward until the Planning & Zoning Permit is approved. CONTACT ROUTING: direct every question, every application, and every follow-up to the Liberty County Building Department at (850) 643-2215. ARPC is named only to explain who performs the code review — never give out ARPC's phone number, email address, or the name of anyone who works there, and never tell an applicant to contact ARPC, a planner, or any outside agency directly. Applicants apply and follow up through the Building Department, not through ARPC." },
  { source: "Office Procedure", section: "Step 2 — Building Permit (after Planning & Zoning approval)", text:
    "Once the Planning & Zoning Permit is approved, the applicant moves to the Building Permit application. At that point they need: engineered house plans, and their contractor's information. The Building Permit fee for residential construction is $0.75 per square foot, so the total depends on the finished square footage of the home. Engineered plans are what the building review uses to confirm the structure meets Florida Building Code for wind load and structural safety." },
  { source: "Office Procedure", section: "Pole barn houses / barndominiums — classified as a residence", text:
    "A pole barn house or barndominium-style building that will be USED AS A RESIDENCE is considered new residential construction — it is NOT treated as an accessory pole barn or agricultural outbuilding. Because it is a dwelling, it must meet all residential building code requirements and is permitted as a home, at the residential building permit rate of $0.75 per square foot. The flat Pole Barn fee in the fee schedule ($125.00 / $150.00 by size) applies ONLY to a true accessory pole barn — a barn, shop, or storage building that nobody lives in. Do NOT quote the $125/$150 pole barn fee for a pole barn house or barndominium that will be lived in; quote the residential rate of $0.75 per square foot instead. The deciding factor is how the finished building will be used, not what it is built out of or what it looks like." },
  { source: "Office Procedure", section: "Where the forms and records are online", text:
    "THE Building Department page — use this as the link whenever an answer points someone to the Building Department, its applications, or its forms online: https://libertycountyfl.org/growth-management/building-department/ . That is the correct and only page to send applicants to; do not link the Growth Management index or the county home page instead of it. The Owner-Builder Application for Building Permit is posted at https://libertycountyfl.org/wp-content/uploads/Building-Permit-App.-Owner-Builder.pdf and the Mobile Home Permit Application at https://libertycountyfl.org/wp-content/uploads/Mobile-Home-Permit-Application.pdf. The Land Development Code is at https://libertycountyfl.org/uploads/2026/01/LIBERTY-COUNTY-Land-Development-Code.pdf and the Comprehensive Plan at https://libertycountyfl.org/uploads/2026/01/Liberty-County-2012-2025-Comp-Plan-1.pdf. To look up a property, parcel, ownership, legal description, acreage, or maps, use the Liberty County Property Appraiser: https://libertypa.org — their parcel search and mapping is also available on qPublic at https://qpublic.schneidercorp.com/Application.aspx?App=LibertyCountyFL&Layer=Parcels&PageType=Search . Liberty County does not have a separate Planning & Zoning web page; planning and zoning is handled through the Clerk's Office intake and ARPC review, so point applicants to the Building Department page or to calling the office rather than to a zoning page online. When a step involves a form or a record the applicant has to obtain, include the relevant link from this list in the answer." },

  { source: "Building Guide", section: "I. New Construction — Intake Rules", page: 1, text:
    "For new construction, verify: (1) Septic/DEP — if no city sewer, applicant must provide a Septic Construction Permit or Existing System Approval from the Florida Department of Environmental Protection (DEP) before the building application is accepted. Septic (onsite sewage treatment and disposal) permitting is handled by DEP, NOT the Health Department — never send an applicant to the Health Department for septic. (2) Notice of Commencement — required if job value exceeds $2,500; must be recorded with the Clerk of Court and posted on the job site before the first inspection is scheduled. (3) Setbacks — Residential (Low Density): Front 20 ft, Side 20 ft, Rear 20 ft. Commercial/High-Density: Front 20 ft, Side 10 ft (20 ft for Commercial), Rear 10 ft (20 ft for Commercial)." },
  { source: "Building Guide", section: "I. New Construction — Fees", page: 1, text:
    "Residential Building Permit: $0.75/sq ft. Commercial Building Permit: $0.85/sq ft. Plumbing, HVAC, Gas & Mechanical: $150.00 flat. Fire Suppression/Hood/Sprinkler System: $100.00 each. Pre-Manufactured ADU (Accessory Dwelling Unit): $150.00 flat. ADU projects also require a $100.00 Tier 1 Site Plan Review to verify setbacks. Florida Law (FS 320.8249) requires a Licensed Mobile Home Installer to perform the physical setup even under an owner-builder exemption." },
  { source: "Building Guide", section: "I. New Construction — Required Forms", page: 1, text:
    "Application for Building Permit is required for every permit type; it captures owner, contractor, valuation, zoning, and utility info, and staff assigns the Permit #, Fee, and surcharges. Notice of Commencement is required when job value exceeds $2,500 (or $15,000 for HVAC changeouts); must be recorded with the Clerk of Court under Chapter 713, F.S., and physically posted at the job site before the first inspection. Owner-Builder Affidavit is required whenever a property owner acts as their own general contractor on new construction, including new homes, commercial buildings under $75,000, and farm outbuildings; the owner must appear in person and sign under FS 489.103(7); a false declaration may be a third-degree felony." },
  { source: "Building Guide", section: "I. New Construction — 2026 Legislative Updates", page: 1, text:
    "Under CS/CS/HB 803 (2026, effective July 1, 2026), building permits for single-family dwellings now carry a new statewide 1-year expiration, in addition to the department's existing rule that a permit is void if work isn't commenced within 6 months or is abandoned for 1 year after commencement. How these two rules interact is still pending confirmation from Kenneth Hosford — staff should currently quote both timeframes rather than assume the new rule replaces the old one. HB 803 also created new mandatory permit review deadlines: 5 business days for most existing single-family residential permits under $15,000; 10 business days for CDBG-Disaster Recovery single-family permits; 12 business days for site-specific permits under a master permit; 30 business days for residential under 7,500 sq ft; 60 business days for larger residential, signs, nonresidential under 25,000 sq ft, multifamily (\u226450 units), and site-plan/plat approvals. If the county misses a deadline without a timely deficiency notice, the permit can be deemed approved by law." },
  { source: "Building Guide", section: "II. Electrical — Fees & Form", page: 3, text:
    "Electrical fees: Residential New Service/Upgrades $150.00; Residential interior wiring $125.00; Commercial New Service/Upgrades $200.00; Commercial interior wiring $175.00; Reconnect/release to the power company with no other electrical work $50.00; Outlets and Switches $50.00; Solar/Generator (Panels and Wiring) $100.00. The interior wiring rates apply only when the existing service, meter, and panel stay unchanged — if any of them is replaced or upsized, charge the new service rate instead. The Electrical Affidavit is required when a property owner pulls their own electrical permit for site power only (e.g., a power pole to a vacant lot) — not connected to any habitable structure. The owner swears the service will NOT connect to a residence, mobile home, camper, RV, or living structure, and that a separate permit/inspection is required before it can. A whole-home generator needs BOTH an Electrical permit and a Gas permit with separate inspections. Solar wiring must be performed by a licensed electrical contractor even under an owner-builder exemption." },
  { source: "Building Guide", section: "III. Renovations — Exemptions & Forms", page: 4, text:
    "The $7,500 Residential Exemption (HB 803, effective July 1, 2026): work on a single-family home valued under $7,500 does not require a permit if strictly cosmetic/non-structural (flooring, cabinets, painting, drywall finishing); a signed Written Request for Exemption (HB 803) must be submitted BEFORE work begins, and staff must check flood hazard status themselves. Electrical, plumbing, mechanical, gas, or structural work always requires a permit regardless of cost. The exemption is void in flood hazard areas, and splitting a project to duck the threshold is illegal. A SEPARATE exemption also applies to temporary residential hurricane/flood walls meeting specified standards, with no dollar threshold — pending confirmation from Kenneth Hosford on which standard applies before staff waive a permit for this. General Affidavit is a flexible notarized statement used for exemption declarations or other sworn statements without a specialized form. The Owner-Builder Affidavit also applies to renovation work (plumbing, mechanical, gas, structural improvements) — same in-person, notarized requirement as new construction." },
  { source: "Exemption Form", section: "Written Request for Exemption (HB 803) — The Form", page: 1, text:
    "The one-page Written Request for Exemption (HB 803) asks for the property, owner, a description of the work, and its total declared value, then has the applicant initial each condition: single-family home, strictly cosmetic work, no electrical/plumbing/mechanical/gas/structural work, under $7,500, not in a flood hazard area, and not a split project. It is signed and turned in before work begins. The office-use section records who received it, the flood hazard check and map source, and whether the work is exempt or needs a permit." },
  { source: "Building Guide", section: "III. Renovations — Fees", page: 4, text:
    "Plumbing, Gas & Mechanical — Residential: $150.00. Plumbing, Gas & Mechanical — Commercial: $200.00. Windows & Siding: $50.00 flat. Bedroom additions on a septic system require a DEP septic permit due to increased system load." },
  { source: "Building Guide", section: "IV. Mobile Homes — Fees & Form", page: 6, text:
    "Mobile Home Set-Up Permit (all sizes): $300.00 flat, plus a $100.00 Tier 1 Site Plan Review. The $300 fee only covers the block, anchor, and tie-down inspection — electrical hookup requires a separate Residential Electrical permit ($150.00). A DEP septic approval must be submitted before the application is accepted. The Mobile Home Permit Worksheet (Blocking Plans) is a required 2-page form the licensed installer completes documenting pier spacing, footer/pad sizes, tiedown components, soil test results (pocket penetrometer and torque probe), and weatherproofing, signed under Rule 15C-1/15C-2. All tests must be performed by a Licensed Mobile Home Installer, not the property owner. A new mobile home PARK is different: its development plan review fee is $1,000.00 or $25.00 per space, whichever is greater, due when the park plans are submitted (Land Development Code 4.6-1)." },
  { source: "Building Guide", section: "IV. Mobile Homes — 2026 Legislative Update", page: 6, text:
    "Under CS/CS/HB 803 (2026, effective July 1, 2026), DBPR may not deny a building permit for certain residential manufactured buildings, and local governments may not adopt or enforce zoning, land use, or development regulations that treat offsite-constructed (manufactured) housing differently than site-built housing. The bill also adds specific permit requirements for placement of manufactured housing on mobile home lots and in single-family zoning districts. Staff should not deny or add extra conditions to a mobile home placement in a single-family zoning district solely because the home is manufactured, if it otherwise meets the same standards as a site-built home. A full zoning-code review with Kenneth Hosford is still pending to confirm Liberty County's code complies." },
  { source: "Building Guide", section: "V. Roofing — Fees & Form", page: 7, text:
    "Roofing Permit: $50.00 for 1 to 1,000 sq ft, $100.00 for 1,000 sq ft and above. The Roof Inspection Affidavit (3rd Party) is required when a third-party inspector, rather than the county inspector, verifies roof deck nailing and/or secondary water barrier installation; it applies the Third-Party Inspection Discount. The inspector (Engineer, Architect, or FS 468 Building Inspector) certifies compliance with the Hurricane Mitigation Retrofit Manual per Section 553.844, F.S., and photos of each roof plane with the permit number/address are required. General Contractors licensed after 1973 without a separate Roofing Contractor license cannot pull or self-perform standalone roofing permits (FS 489.113)." },
  { source: "Building Guide", section: "V. Roofing — 2026 Legislative Update (Private Providers)", page: 7, text:
    "CS/CS/HB 803 (2026) substantially amended Fla. Stat. \u00a7553.791 governing private providers (third-party inspectors), effective July 1, 2026. An owner/contractor may use a private provider at any time without prior conditions and no longer must give advance inspection notice. The county's authority to re-review or re-inspect work a private provider already certified is now much narrower: staff may generally only check private-provider paperwork for completeness, not substantive code compliance, except for local ordinance, floodplain, and site-review matters. For the Roof Inspection Affidavit specifically: once a licensed private provider certifies the roof inspection, the county building official may only re-inspect if there is specific knowledge the inspection wasn't actually performed, and must give the provider written notice of that concern first. An internal policy update on how staff log/process these certifications is still pending Kenneth Hosford's sign-off." },
  { source: "Building Guide", section: "VI. Accessory Buildings (Non-Residential)", page: 8, text:
    "Accessory structures/sheds for single-family or two-family dwellings under 120 sq ft are exempt from Site Plan Review and don't require a structural permit or fee. Fees: Accessory Building — Open, roof only and no walls (formerly Pole Barn — Open) $125.00; Accessory Building — Enclosed, any walls full or partial (formerly Pole Barn — Enclosed) $150.00; Accessory Building — Enclosing an existing permitted open structure $50.00; Portable Sheds/Garages 120-400 sq ft $30.00, over 400 sq ft $50.00. \"Accessory Building\" covers any non-dwelling accessory structure regardless of construction method or material — pole barns and post-frame buildings, metal or steel-frame barns, aluminum buildings, equipment sheds, carports, shops, and lean-tos; the fee turns on whether the structure is open or enclosed, not on what it is built from. The Pole Barn/Accessory Structure Affidavit (No Wastewater) is required when the owner declares NO plumbing will be installed — no toilet, sink, or water connection beyond an outside spigot. If plumbing is mentioned, do NOT use this affidavit; the owner must get a DEP septic permit first. Violating the affidavit lets the County direct the power company to disconnect electric service." },
  { source: "Building Guide", section: "VII. Comprehensive Plan Review — Fees & Form", page: 9, text:
    "Tier 1 Site Plan Review: $100.00. Tier 2: $350.00. Property Split Review: $150.00. Comprehensive Plan Amendment (Small-Scale, under 10 acres): $1,500.00; (Large-Scale, over 10 acres): $5,000.00. Amendment to Land Development Regulations: $1,500.00. Subdivision Plat Approval: $1,000.00 or $25.00 per lot, whichever is greater. Special Exception: $1,000.00. Variance: $350.00. Other Conditional Uses: $2,000.00. Special Temporary Use Permit — Commission Issued: $200.00; Staff Issued: $50.00. The 911 Address Request form is required whenever a new address is needed, or an existing address needs confirming/correcting — common for new construction, mobile home placement, or a power pole on a vacant lot. A confirmed 911 address is required before any inspection and before a Certificate of Occupancy is issued." },
  { source: "Building Guide", section: "VII. Zoning Tips — Alcohol & River Buffers", page: 9, text:
    "Any alcohol establishment (e.g., a package store) in a commercial zone requires a Conditional Use/Special Exception ($1,000.00) before the Board of Adjustment; if the property line is within 1,000 feet of a school, church, public playground, or residential district, it faces automatic statutory denial. Structures near the Apalachicola River, Ochlockonee River, Telogia Creek, or New River must clear a mandatory 75-foot native vegetation buffer from the ordinary high-water line, regardless of the structure's size — even a shed under the 120 sq ft exemption must still clear this buffer, verified via a $100.00 Tier 1 Site Plan Review." },
  { source: "Building Guide", section: "VIII. Miscellaneous — Fees & 2026 Update", page: 10, text:
    "Decks and Ramps (uncovered deck, patio, steps or ramp): $100.00. Porch, Covered Patio or Attached Carport — roofed with open sides, attached to a dwelling: $125.00 flat, any size. Screening an existing covered porch: $50.00. Sign Permit: $100.00. Swimming Pool (all sizes): $100.00 — Florida Statute 489.103(6) excludes in-ground swimming pools from the owner-builder exemption; a Licensed Commercial Pool/Spa Contractor (CPC) is legally required. Communication Tower (Conditional Land Use): $3,500.00 non-refundable application fee plus a $3,000.00 refundable consultant escrow deposit. Co-Location on Existing Tower: $2,000.00 non-refundable. Under CS/CS/HB 803 (2026), a retaining wall spanning more than one lot or parcel now requires a single building permit covering the project as a whole, not a separate permit per parcel." },
  { source: "Building Guide", section: "IX. Additional Permit Rules", page: 11, text:
    "Third-Party Inspection Discount: 40% off permit fee (current department rate). Plan review is included in the permit fee — no separate plan review charge is collected. There is NO renewal fee; an expiring permit may be extended on written request at no charge. Penalty for work started before permit issued: double the permit fee. Under CS/CS/HB 803 (2026), commercial permit fee reductions for private-provider use are now a statutory minimum — at least 25% off when a private provider does either plan review or inspection, at least 50% off when they do both; failing to apply the minimum forfeits the county's ability to collect any fee on that project. It's still pending review with Kenneth Hosford whether the department's flat 40% rate satisfies this for commercial private-provider projects. Separately, HB 803 restricts inspection fees from being based on project valuation — they must instead reflect actual cost of providing inspection services. Whether the county's $0.75/sq ft (Residential) and $0.85/sq ft (Commercial) building permit fees are affected is a pending fee-methodology question for Kenneth Hosford and finance, not something to resolve at the counter." },
  { source: "Building Guide", section: "X. Glossary — HOA & Statewide Form Note", page: 12, text:
    "Under CS/CS/HB 803 (2026), amending Chapter 720, F.S. (\u00a7720.3035), a homeowners' association, architectural review committee, or similar committee may no longer require a building permit to be issued as a prerequisite for the association's own review of proposed construction. Separately, HB 803 directs the Florida Building Commission to create a standardized statewide residential and commercial permit application by July 1, 2027 — the current Application for Building Permit form is expected to be replaced within that revision cycle." },
  { source: "Building Guide", section: "X. Glossary — Key Terms", page: 12, text:
    "Setback: minimum required horizontal distance a structure must be kept from a property line. Lot Coverage: percentage of a parcel covered by roofs/buildings. Site Plan Review: administrative check of a development's layout against local rules before a permit is granted. Variance: dimensional relief from zoning granted by the Board of Adjustment only for a unique physical hardship. Conditional Use/Special Exception: a high-impact land use requiring a public hearing and Board-approved conditions. Single-Family Dwelling: one family unit, one kitchen, one electrical meter. Multifamily: 3+ separate family units (a duplex is two-family, not multifamily). Private Provider: a licensed engineer, architect, or building code administrator authorized under Fla. Stat. \u00a7553.791 to perform plan review or inspection in place of the local building department." },
  { source: "HB 803 Memo", section: "Executive Summary", page: 1, text:
    "CS/CS/HB 803 (2026), Chapter 2026-63, Laws of Florida, was signed May 7, 2026 and took effect July 1, 2026. Beyond the well-known $7,500 nonstructural permit exemption, it also changes single-family permit expiration terms, adds mandatory permit review-time deadlines, overhauls the private provider (third-party inspection) framework, restricts how inspection fees can be calculated, adds a second no-threshold exemption for temporary hurricane/flood walls, and touches manufactured housing zoning and HOA architectural review rules." },
  { source: "HB 803 Memo", section: "Confirmed / Already Incorporated", page: 1, text:
    "The $7,500 nonstructural exemption is correctly reflected in the Building Department Guide (Section III): the threshold, the July 1, 2026 effective date, the Written Request for Exemption requirement, the anti-splitting rule, and the exclusion for electrical/plumbing/structural/mechanical/gas work and flood hazard areas are all in place and require no further changes." },
  { source: "HB 803 Memo", section: "Items Still Pending Legal/Fee Review", page: 1, text:
    "Several HB 803 provisions are flagged as pending further review before staff should treat them as settled: (1) how the new 1-year single-family permit expiration interacts with the department's existing 6-month commencement rule — pending Kenneth Hosford; (2) the temporary hurricane/flood wall exemption's 'specified standards' — pending Kenneth Hosford; (3) Liberty County's zoning code compliance with the manufactured-housing nondiscrimination rule — pending a zoning code review with Kenneth Hosford; (4) whether the department's 40% Third-Party Inspection Discount satisfies HB 803's new 25%/50% statutory minimums for commercial private-provider projects — pending Kenneth Hosford; (5) whether the county's per-square-foot building permit fees are affected by the new inspection-fee valuation restriction — pending a cost-basis review with Kenneth Hosford and finance; (6) a tracking workflow for the new mandatory review-time deadlines — pending a supervisor-level process decision." },

  // ── 2026 Building Dept Fee Schedule (official PDF) ──────────────────────
  { source: "2026 Fee Schedule", section: "Site Plan Review Tiers — Clarified", page: 2, text:
    "The official 2026 Fee Schedule clarifies which projects fall into which Site Plan Review tier. Tier 1 Application Review ($100.00) covers Single-Family Homes, Mobile Home Setups, and Simple Additions. Tier 2 Application Review ($350.00) covers Industrial, Commercial, and Multifamily projects. This is a more specific breakdown than a flat 'Tier 1 vs Tier 2' label — use project type, not just size, to sort a customer into the correct tier." },
  { source: "2026 Fee Schedule", section: "Fee Confirmation", page: 1, text:
    "The 2026 Building Department Fee Schedule and the Building Guide agree on all fee amounts (Residential $0.75/sq ft, Commercial $0.85/sq ft, Mobile Home Set-Up $300 flat excluding electrical, Roofing $50/$100 by size tier, Accessory Buildings (formerly Pole Barns) $125 open / $150 enclosed, Sheds $30/$50 by size tier, Electrical fees, Comprehensive Plan Review fees, and the Additional Permit Rules: 40% third-party inspection discount, plan review included, no renewal fee, double-fee penalty). Where the Land Development Code sets a fee — mobile home park review, final plat approval, communication towers — the Code controls, and the schedule repeats the Code's figures." },
  { source: "2026 Fee Schedule", section: "Communication Tower & Co-Location Fees", page: 2, text:
    "New communication tower (Land Development Code 8.5–8.7): $3,500.00 non-refundable application fee; a $3,000.00 refundable consultant escrow deposit that must be topped up if it runs out, with any balance refunded; and a performance bond of at least $75,000.00, which is security, not a fee. Co-location on an existing tower: $2,000.00 non-refundable (Land Development Code 8.6). Where the fee schedule and the Land Development Code ever differ, the Code's figure is charged." },
  { source: "2026 Fee Schedule", section: "Subdivision Plat Fee", page: 2, text:
    "Application for Subdivision Plat Approval is $1,000.00 or $25.00 per lot, whichever is greater — the fee schedule and the Land Development Code agree. A plat with more than 40 lots pays $25 times the number of lots." },
  { source: "2026 Fee Schedule", section: "Factory-Built (Modular) Commercial Buildings", page: 1, text:
    "A factory-built (modular) commercial building bearing a valid State of Florida (DBPR) insignia is charged $0.35 per square foot, covering site work only: erection, assembly, foundation, and anchoring. Foundation and anchoring plans must be sealed by a Florida-licensed engineer. Electrical, plumbing, mechanical, and site plan review are charged separately. A pre-engineered metal or aluminum building delivered as a kit or components with NO state insignia is not factory-built — it is charged the standard commercial rate of $0.85 per square foot." },
  { source: "2026 Fee Schedule", section: "Inspection Fees", page: 2, text:
    "Additional Inspection: $50.00 — any inspection beyond those included with the permit, such as added or altered work, a partial inspection, or one requested out of sequence. Re-Inspection: $50.00 each after the first, when work failed or was not ready. The first re-inspection is free. Both fees must be paid before the inspection is scheduled." },

  // ── Comprehensive Plan (2012-2025) ──────────────────────────────────────
  { source: "Comprehensive Plan", section: "Future Land Use — Density by Category", page: 1, text:
    "Per the Future Land Use Element, residential density caps by land use category: Agriculture — 1 dwelling unit per 10 acres (clustering down to 1-acre lots encouraged). Conservation/Resource Protection areas — 1 unit per 5 acres maximum, and commercial/industrial/solid waste/hazardous waste uses are prohibited entirely. Mixed Use Rural Residential — 1 unit/acre gross density cap. Mixed Use Suburban Residential — up to 2 units/acre. Rural Village — 2 dwelling units per acre where there is no central sewer or water, 4 per acre where central water is available, and never more than 4 even where both central water and sewer are available; all housing types are allowed, from as low as one unit per five acres. Town Center — 8 units/acre with both central water and sewer, 4 with central water only, 2 with neither. Commercial — residential from one unit per five acres up to one unit per acre, and residential may not exceed 30 percent of the area. Industrial, Public Institutional, Public Resource Management and Public Preservation carry no residential density. There is no fourth, in-between figure for any category: if a question asks what applies with central water only, the answer is the 'central water' figure above, not a range. These figures match the Land Development Code's per-district tables." },
  { source: "Office Procedure", section: "How many lots can be created from a parent parcel — there is no numeric cap", text:
    "Is there a limit to the number of lots that can be created from a parent parcel? There is NO maximum number of lots stated anywhere in the Land Development Code or the Comprehensive Plan. The count is limited by four rules stacking, and whichever bites first is the answer. (1) DENSITY for the future land use category, applied to the acreage of the parent parcel: Agriculture 1 dwelling per 10 acres; Rural Village 2 per acre without central water or sewer, 4 with central water, never more than 4; Mixed Use Rural Residential 1 per acre; Mixed Use Suburban Residential 2 per acre; Town Center 2 without central service, 4 with central water, 8 with both; Conservation 1 per 5 acres. (2) MINIMUM LOT SIZE — 10,000 square feet for a single-family dwelling, LDC Section 5.4(C). (3) LOT SHAPE — every lot must front on a street for at least 60 feet; a lot of 15,000 square feet or more needs a minimum average width of 100 feet, and 10,000 to 15,000 square feet needs 80 feet. (4) WHETHER A NEW STREET IS CREATED — any division that establishes a new street is a subdivision no matter how few lots it makes. Density is almost always the binding one: a 3.84-acre parcel in Rural Village would allow 16 lots on the 10,000 sq ft minimum but only 7 on the 2-per-acre density, so 7 is the answer; 100 acres in Agriculture allows 435 by lot size but only 10 by density. The figure '15 parcels' is NOT a cap on lots — it is the ceiling for skipping the plat, and only where every parcel is ten acres or more with no new roads or easements. When someone asks for the limit, do the arithmetic for their acreage and category and give the number; do not answer that the material does not address it." },
  { source: "Office Procedure", section: "Wellhead setbacks — the 200-foot zone does not apply to a private well", text:
    "How close can someone build to a well, and does the 200-foot wellhead zone of exclusion apply to a private residential well? The Land Development Code answers it directly: Section 6.4-4(A) says areas within two hundred feet of a potable water supply well — and the Code writes the exclusion in brackets, ‘but not individual private wells’ — are the zone of exclusion where no land development activity is permitted. So a homeowner drilling or using their own well on their own parcel is NOT barred from building within 200 feet of it. The 200-foot exclusion protects public and community potable water supply wells, which is also how the Code defines a wellfield: an area containing one or more wells used for PUBLIC water supply. Between 200 and 500 feet of such a well, development is allowed but certain uses are not: LDC 6.4-4(B) prohibits hazardous or toxic materials handling and storage, naming landfills, gasoline stations, petroleum storage and pesticide storage; Comprehensive Plan Policy 1-5 adds feedlots and commercial animal facilities, wastewater treatment plants and percolation ponds, mines, and excavation of waterways that intersect the water table. CAUTION when quoting the Plan on its own: Policy 1-5 states the 200-foot zone of exclusion WITHOUT the private-well carve-out the Code has, and where the two disagree the Plan controls. Read literally, the Plan would stop an owner building within 200 feet of their own well, which is not what was intended and is on the county’s list of amendments to make. Until the Plan is corrected, apply the Code’s rule — private wells are not subject to the 200-foot exclusion — and say that the Plan language is being cleaned up. Note also that neither document defines ‘wellhead’ or ‘land development activity’; only ‘wellfield’ is defined." },
  { source: "Office Procedure", section: "Splitting the same land twice — is there a waiting period?", text:
    "How long before someone can split a parcel again, and can repeated two-lot splits be used to avoid the subdivision process? There is NO waiting period, cooling-off period or lookback period anywhere in the Land Development Code or the Comprehensive Plan. Nothing in the Code counts the lots previously created from the same parent parcel, and no procedure for a lot split is defined at all, so as the Code reads today an owner could split into two, then split one of those into two again, and each step would be handled as a Property Split Review at $150.00 rather than as a subdivision plat. That is a real gap and it is on the county's list of amendments to make. What the Code DOES give staff in the meantime: the definition of a subdivision covers a division of land 'for the purpose, whether immediate or future, of transfer of ownership' (LDC Sec. 2.4 and Section 5.2), and it expressly 'includes a resubdivision.' So where an applicant has told the county — in an application, an email or at the counter — that the intent is to end up with three or more lots, the division is a subdivision from the start, even if it is carried out in stages, and the plat requirement applies. Document what the applicant says about their intent, because that written record is what supports treating staged splits as one subdivision. Also note the floodplain rule is not avoided by splitting in stages: the Plan says no new tracts, lots or parcels may be created that lack enough uplands, and any new lot containing wetlands or floodplain must be at least 5 acres — that applies to every newly created lot however it was created. If the question is about closing the loophole rather than applying it, the usual fix is to define the parent parcel as of a fixed date and count every division from it cumulatively; that is an amendment for the Board and the County Attorney, not a counter decision, and SB 180 may restrict adopting a new restriction until the freeze lifts." },
  { source: "Office Procedure", section: "Splitting land — the complete checklist before quoting an applicant", text:
    "Everything that governs dividing land in Liberty County, in one place. PROCESS: two lots is not a subdivision — it is a Property Split Review, $150.00. Three or more lots IS a subdivision (LDC Section 2.4 and Section 5.2) and needs Subdivision Plat Approval under Section 5.3 — $1,000.00 or $25.00 per lot, whichever is greater, on a plat prepared and sealed by a Florida Professional Surveyor and Mapper, approved by the Board of County Commissioners. The plat exemption applies only to a division into no more than 15 parcels of TEN ACRES OR MORE each, with no new public roads, streets, rights-of-way or utility easements (a Minor Subdivision); a parcel too small to yield ten-acre lots can never use it. DESIGN STANDARDS once it is a subdivision (Section 5.4): lots shall front on a street for at least 60 feet; minimum lot size 10,000 square feet for a single-family dwelling; lots of 15,000 square feet or more need a 100-foot minimum average width, and 10,000 to 15,000 square feet need 80 feet; corner lots 15 percent wider; the street system must connect to a county or state road approved for county maintenance. FLOOD AND WETLAND: a new residential subdivision that includes wetlands or floodplain must cluster development in the uplands; no new lot may be created without enough uplands for all structures and roadways plus a 50-foot natural vegetated upland buffer; ANY new lot that contains wetlands or floodplain must be AT LEAST 5 ACRES, with the wetland or floodplain shown on the plat as undevelopable. On a parcel smaller than five acres this is decisive — a lot containing floodplain cannot be created at all, so check the FEMA flood map against the parcel before telling anyone the split works. A 75-foot native vegetation buffer applies along the Apalachicola River, the Ochlockonee River, Telogia Creek and the New River. ALSO: density for the future land use category caps the count; a parent tract divided by a public road that existed on or before September 24, 1992 counts as a separate parent tract on each side, each granted at least one single-family unit; and Comprehensive Plan Policy 8-2 allows a parcel in single ownership to be subdivided for immediate family members' primary residences. The phrase 'lot split' does not appear in the Land Development Code — the county's mechanisms are the Property Split Review for two lots and the subdivision plat for three or more, so answer with those rather than saying the Code is silent." },
  { source: "Comprehensive Plan", section: "Wetland & Floodplain Lot Requirements", page: 5, text:
    "New residential subdivisions that include wetlands and/or floodplains must cluster development in upland areas — they cannot create lots without enough uplands to fit all structures, roadways, and a minimum 50-foot natural vegetated upland buffer. Any new lot containing wetlands or floodplain must be at least 5 acres in size, with adequate uplands to accommodate all development, and the wetland/floodplain area must be shown on the plat as undevelopable. Separately, a 75-foot native vegetation buffer (measured from the ordinary high-water line) is required adjacent to the Apalachicola River, Ochlockonee River, Telogia Creek, and New River — this is the same 75-foot river buffer already referenced in the Building Guide's zoning tips." },
  { source: "Comprehensive Plan", section: "Wellhead Protection Zones", page: 6, text:
    "The County maintains wellhead protection areas around potable water wells. Zone of exclusion: no development activity is allowed within 200 feet of a wellhead. Wellhead protection area: extends 500 feet from the wellhead; within this zone, landfills, bulk storage/handling of hazardous or restricted substances, feedlots or commercial animal facilities, wastewater treatment plants, percolation ponds, mines, and excavation of waterways intersecting the water table are all prohibited. These 200 ft / 500 ft figures are confirmed identically in the Land Development Code (Section 6.4-4)." },
  { source: "Comprehensive Plan", section: "Concurrency & Building Permits", page: 5, text:
    "Development orders and building permits will NOT be issued if they would cause a reduction in the adopted level-of-service (LOS) standards for facilities (roads, sanitary sewer, potable water, drainage, solid waste, recreation). Where no zoning change, subdivision, or site plan approval is required, the concurrency determination is made at the time of building permit review — no building permit shall be issued unless the facilities serving that area meet the adopted LOS standards, with a narrow exception for residential units on single platted lots of record predating the concurrency requirements. This is a standing legal basis for denying or conditioning a permit even when all other paperwork is in order." },
  { source: "Comprehensive Plan", section: "Multilaning Road Setbacks", page: 12, text:
    "For roads identified for future multilaning on the long-range transportation plan, building setbacks are the greater of: (1) 75 feet from the centerline of the existing right-of-way, or (2) 25 feet from the existing property line. Parking and retention facilities are not allowed within this designated setback area. This is separate from and in addition to the standard front-yard setbacks already in the Building Guide." },
  { source: "Comprehensive Plan", section: "Manufactured Housing — Countywide Allowance", page: 14, text:
    "Per the Housing Element (Policy 4-1), manufactured housing units are allowed in ALL zoning categories countywide, and all types of multi-family housing are allowed in zoning categories consistent with the applicable land use category. Regulations applying to manufactured housing and mobile homes must be consistent with Sections 320.8285(5) and 553.38, Florida Statutes. This predates and is consistent with — not contradicted by — the 2026 HB 803 manufactured-housing nondiscrimination requirement already flagged elsewhere in this knowledge base." },
  { source: "Comprehensive Plan", section: "Water Fixture Maximum-Use Standards", page: 46, text:
    "All new construction and additions to existing structures must use fixtures meeting these maximum water-use limits: water closets (tank or flushometer type) 3.5 gallons/flush; urinals (tank or flushometer type) 3.5 gallons/flush; showerheads 3.5 gallons/minute; lavatory and sink faucets 2.5 gallons/minute. These are enforced through the building permit procedure." },

  // ── Land Development Code ───────────────────────────────────────────────
  { source: "Land Development Code", section: "Schedule 1.0 — Minimum Setback & Height Standards", page: 85, text:
    "The Land Development Code's Schedule 1.0 sets minimum building setbacks and maximum height by use type. Low Density Residential (0-6 units/acre): Front 20 ft, Side 5 ft, Rear 20 ft, max height 35 ft (no parking setback applies). Medium-High Density Residential (over 6 units/acre): Front 20 ft (parking 20 ft), Side 5 ft (parking 5 ft), Rear 20 ft (parking 10 ft), max height 45 ft. Industrial/Commercial/Office: Front 20 ft (parking 20 ft), Side 10 ft (parking 10 ft), Rear 20 ft (parking 10 ft), max height 45 ft. Corner yard setbacks match front yard setbacks in all three categories. Compare this to the Building Guide's simpler setback bullets — this Schedule 1.0 table is the authoritative, code-level source and includes the medium-high-density tier and parking setbacks the Guide doesn't break out. HOW FAR FROM THE PROPERTY LINE: this is the table that answers it. Someone asking where on their lot they can put a barn, a shed, a pole barn, a garage, a shop, a carport or a house — how far from the property line, how close to the line, how far back from the road — is asking for these distances. On a Low Density Residential parcel a building must sit at least 20 feet back from the front line, 20 feet from the rear line and 5 feet from each side line, and no taller than 35 feet. ACCESSORY BUILDINGS: Schedule 1.0 sets its standards by type of use, not by principal versus accessory building, and the Code gives no separate setback for an accessory building — so a barn, shed or detached garage on a low density residential parcel is held to the same 20 ft front, 5 ft side and 20 ft rear. Two things to check before quoting it: confirm which land use category the parcel is in, because the distances change between the three columns; and a road on the long-range plan for multilaning carries a larger setback of its own — the greater of 75 feet from the centerline or 25 feet from the property line. CAUTION: the Building Guide states a 20 ft side yard for Residential (Low Density) where this Code table says 5 ft. Where they disagree the Code governs, so quote 5 ft and flag the Guide for correction." },
  { source: "Land Development Code", section: "Mobile Home Park Fee", page: 88, text:
    "Mobile home PARKS (as opposed to a single mobile home set-up on an individual lot) require a separate fee at the time plans are submitted: $1,000.00 OR $25.00 per mobile home space, whichever is greater. This is distinct from — and in addition to — the standard $300.00 Mobile Home Set-Up Permit used for a single home on a single lot." },
  { source: "Land Development Code", section: "Site Plan Review — What Triggers It", page: 89, text:
    "A site plan review is required for: (1) all permitted uses in any district EXCEPT single-family detached dwellings, two-family dwellings, and their accessory uses/structures; (2) all special exception uses in any district; (3) building alterations or remodeling (other than single/two-family dwellings) that affect 50% or more of the floor area of the principal building, OR where the cost of the alteration exceeds 50% of the assessed value of the improvements on the site prior to the work. The County has 10 working days to determine an application's completeness and accept or reject it. An approved site plan is valid for 12 months from County Commission approval — if a development order isn't issued within that window, the site plan approval becomes null and void." },
  { source: "Land Development Code", section: "Subdivision Minimum Design Standards", page: 113, text:
    "Key subdivision design minimums: minimum right-of-way width 60 feet; dead-end streets need an 80-foot minimum paved turnaround diameter (100-foot ROW diameter); lots must front on a street for at least 60 feet; corner lots must be 15% wider than the subdivision's minimum planned width; minimum lot size for a single-family dwelling is 10,000 square feet; lots of 15,000+ sq ft need a minimum average width of 100 feet, lots between 10,000-15,000 sq ft need a minimum average width of 80 feet. Private streets are normally prohibited but may be approved for Minor Subdivisions of 15 or fewer lots where every lot is 10 acres or larger." },
  { source: "Land Development Code", section: "Subdivision Improvement & Maintenance Security", page: 115, text:
    "Before final plat action, the developer must either complete all required improvements or post a surety/performance bond (110% of the County Engineer's estimated cost) to guarantee completion within 2 years (up to 7 years for lots sold on installment contracts). After the improvement security is released, a separate maintenance security takes over for 3 years (or until the County Engineer recommends release), set at 25% of the County Engineer's estimated improvement cost." },
  { source: "Land Development Code", section: "Non-Conforming Use — 6-Month Discontinuance Rule", page: 37, text:
    "If a non-conforming use of a structure (or structure-and-premises combination) ceases for more than 6 consecutive months for any reason (other than governmental action preventing use), any subsequent use of that property must conform to the current zoning regulations for that district — the property loses its grandfathered non-conforming status. This is a different 6-month rule than the building-permit commencement clock; don't conflate the two when a customer asks about either." },
  { source: "Land Development Code", section: "Sign Regulations — Size Limits", page: 96, text:
    "On-site commercial sign size limits by area: General Commercial areas adjacent to Highway 20 or Highway 12 — up to 70 sq ft. Other Commercial areas — up to 50 sq ft. Residential neighborhoods — up to 20 sq ft. Within residential subdivisions — up to 12 sq ft. \"For sale/lease/rent\" signs are exempt from the standard Sign Permit process but capped at 6 sq ft in residential districts or 12 sq ft elsewhere. Replacement of an existing permitted sign (same location, same size, no new lighting) can be approved administratively; all new or expanded signs require full site-plan approval." },
  { source: "Land Development Code", section: "Wireless Tower — Application Requirements", page: 134, text:
    "Wireless Communication Facilities are reviewed as a Special Exception/Conditional Use AND require full building permitting. They're allowed in all Future Land Use categories EXCEPT Conservation/Environmentally Sensitive areas (wetlands, floodplains). Required with the application: signed statements from the property owner and wireless provider, a scaled site plan showing all structures and natural features with measured distances to property lines, FCC license copy, NIER (radiation) level certification, and documentation of efforts to co-locate on an existing tower before proposing a new one. A fall zone of at least 110% of tower height is required, contained within the applicant's own property (or with signed consent from any neighboring property whose land falls within the zone) — if the fall zone would reach any residential structure other than the applicant's own, the application must be denied. Towers are considered abandoned (subject to required removal) after 180 consecutive days without use." },

  // ── Permit Eligibility Guide (2026 Building Permit Authorization & Eligibility) ──
  { source: "Permit Eligibility Guide", section: "Owner-Builder Exemption — Owner-Occupied Property Only", page: 1, text:
    "The owner-builder exemption (FS 489.103(7)) applies ONLY to property the owner personally occupies or uses — a 1–2 family residence for the owner's own use. It does NOT apply to rental property, investment property, or any property currently leased or intended to be leased; for those, a licensed contractor is required for all permitted work regardless of permit type. To use the exemption, the owner must personally appear, sign the owner-builder affidavit, directly supervise all work, and may not hire unlicensed persons. If the owner sells or leases the property within 1 year of completion, the law presumes it was built for sale or lease — a violation of the exemption." },
  { source: "Permit Eligibility Guide", section: "New Construction — Who Can Pull the Permit & Do the Work", page: 1, text:
    "Residential Building Permit ($0.75/sq ft): owner-builder OR licensed General Contractor; owner-builder is allowed for a 1–2 family residence for the owner's own use. Commercial Building Permit ($0.85/sq ft): licensed General Contractor required; the owner-builder exception applies only if construction cost is $75,000 or less AND for the owner's own use/occupancy (FS 489.103(7), 489.113). Plumbing, HVAC, Gas & Mechanical ($150 flat): licensed specialty subcontractor only — there is no owner-builder exception for gas or mechanical work regardless of project size (FS 489.113(3)(a)). Fire Suppression/Hood/Sprinkler ($100): licensed fire suppression contractor only — a life-safety system with no owner-builder exception (FS 633). Pre-manufactured ADU ($150): the owner may submit the application, but the physical setup must be performed by a licensed mobile home installer (FS 320.8249) and utility connections by licensed trades." },
  { source: "Permit Eligibility Guide", section: "Electrical — Who Can Pull the Permit & Do the Work", page: 2, text:
    "Residential electrical — new service/upgrades ($150) and outlets & switches ($50): owner-builder OR licensed electrician. FS 489.503(1) grants the owner-builder electrical exemption for a single-family home or duplex the owner uses (not for sale or lease); the owner must personally apply and cannot hire unlicensed subcontractors. Commercial electrical ($200): licensed electrical contractor required (owner-builder only under $75,000 for the owner's own occupancy). Solar — panels & wiring ($100): the owner may apply, but a licensed electrical contractor MUST perform ALL wiring and interconnection to the home's electrical system even under an owner-builder permit — no exceptions (FS 489.103(7)(a)(3))." },
  { source: "Permit Eligibility Guide", section: "Renovations & Roofing — Who Can Pull the Permit & Do the Work", page: 2, text:
    "Renovation Plumbing/Gas/Mechanical — Residential ($150) and Commercial ($200): licensed specialty subcontractor only; no owner-builder exception for gas (FS 489.113(3)(a)). Windows & Siding ($50): the owner (own home, own use) or a licensed Building/Residential contractor. Roofing ($50 for 1–1,000 sq ft; $100 for 1,000 sq ft and above): owner-builder is allowed on the owner's own 1–2 family residence for personal use, otherwise a licensed roofing contractor is required. General Contractors certified after 1973 may NOT self-perform roofing unless they also hold a roofing contractor license (FS 489.113(3)(g))." },
  { source: "Permit Eligibility Guide", section: "Mobile Homes & Accessory Buildings — Who Can Pull the Permit & Do the Work", page: 3, text:
    "Mobile Home Set-Up ($300 flat, excludes electrical): the owner may pull the permit but CANNOT perform the installation — a licensed mobile home installer is required for the physical setup (FS 320.8249 and FAC 15C-2.0073, which supersede the general owner-builder exemption), and electrical hookup requires a separately licensed electrician. Accessory Buildings, formerly Pole Barns — Open ($125) / Enclosed ($150) / Enclosing an existing permitted open structure ($50): owner or contractor; FS 489.103(7)(a)(1) specifically exempts farm outbuildings, but any interior electrical or plumbing still requires licensed subcontractors. Portable Sheds & Garages: 120–400 sq ft ($30) the owner may build with no contractor license; over 400 sq ft ($50) owner or contractor, and larger structures may require engineered drawings. All accessory structures must still meet setback, zoning, and wind-load requirements." },
  { source: "Permit Eligibility Guide", section: "Site Plan & Zoning Applications — Who Can Apply", page: 3, text:
    "Site Plan Approval — Tier 1 ($100, single-family homes/mobile home setups/simple additions) and Tier 2 ($350, industrial/commercial/multifamily): the owner or an authorized agent may apply; Tier 2 plans may require a Florida-licensed Professional Engineer (PE) or Registered Architect (RA) seal. Comprehensive Plan Amendments — Small-Scale under 10 acres ($1,500) and Large-Scale over 10 acres ($5,000): any owner or authorized representative may submit. Subdivision Plat Approval ($1,000): the plat MUST be prepared and sealed by a Florida Professional Surveyor and Mapper (PSM); the owner or agent submits the application. Property Split Review ($150), Special Exception ($1,000), Variance ($350), and Other Conditional Uses ($2,000): the owner or an authorized agent may apply — no contractor license is needed to apply." },
  { source: "Permit Eligibility Guide", section: "Signs, Pools, Towers & Permit-Wide Rules", page: 4, text:
    "Sign Permit ($100): the owner may install non-electrical signs on their own property; illuminated or electrical signs require a licensed electrical contractor for the wiring. Swimming Pool ($100, all sizes): a licensed Swimming Pool/Spa Contractor (CPC) is required — FS 489.103(6) excludes in-ground pools and spas from the owner-builder exemption. Communication Tower ($3,500 plus a $3,000 escrow deposit): a licensed General Contractor plus PE-sealed structural plans are required. Co-Location on an existing tower ($2,000): a licensed contractor performs the work. Permit-wide rules: an approved third-party inspection earns a 40% fee discount; there is no renewal fee; and starting work before the permit is issued incurs DOUBLE the permit fee." },

  // ── Splitting land: asked constantly at the counter, and the rule sits
  // inside a definition in the code rather than under a heading anyone
  // would search for.
  { source: "Land Development Code", section: "Splitting land — when a division needs plat approval (Section 5.2)", page: 109, text:
    "Dividing a parcel into THREE (3) OR MORE lots is a subdivision under the Land Development Code, Section 5.2, and needs Subdivision Plat Approval ($1,000.00 or $25.00 per lot, whichever is greater); the plat must be prepared and sealed by a Florida Professional Surveyor and Mapper. Splitting into two lots is not a subdivision — that is a Property Split Review ($150.00). Two exclusions: a division into no more than 15 parcels of ten (10) acres or more each, exclusive of street right-of-way, is exempt and does not need a plat, and any division that establishes a new street or road is a subdivision regardless of how few lots it creates. Every resulting lot must still meet the minimum lot size, width, and density limits for its future land use category." },

  // ── Which document governs. Staff and applicants mix these up constantly,
  // and the answer decides whether a request is a permit, a rezoning, or a
  // Board decision.
  { source: "Office Procedure", section: "Difference between the comp plan and the LDC — which one governs", text:
    "The difference between the Comprehensive Plan (the comp plan) and the Land Development Code (the LDC): the comp plan says what the county intends to happen, and the LDC is the rulebook that makes it happen. The Comprehensive Plan is the county's long-range policy document required by Chapter 163, Florida Statutes. It is written as goals, objectives and policies, carries the Future Land Use Map that gives every parcel a category (Agriculture, Rural Residential, Town Center, and so on), and sets the big limits such as density caps — 1 dwelling unit per 10 acres in Agriculture, up to 4 units per acre in Rural Village. The Land Development Code is the enforceable ordinance that carries the Plan out: setbacks, minimum lot sizes and widths, road right-of-way widths, sign sizes, tower rules, and the permit and review procedures. The Plan's Objective 1 requires growth to be managed through the Land Development Regulations that implement the Future Land Use Map, and Policy 1-1 lists what those regulations must cover. Where the two disagree the PLAN CONTROLS: Land Development Code Section 1.4 says its provisions are read unless doing so would be inconsistent with the Comprehensive Plan. Changing the Plan is a Comprehensive Plan Amendment ($1,500.00 small-scale under 10 acres, $5,000.00 large-scale); changing the Code is an Amendment to Land Development Regulations ($1,500.00); both are Board decisions, not staff decisions. Rule of thumb at the counter: if the answer is a number in a table (setback, lot width, fee), it is a Code question; if the answer depends on what the land is designated for, it is a Plan question, and a use the designation does not allow needs a Plan amendment or rezoning rather than a permit." },
  { source: "Building Design Criteria", section: "Adopted code, wind speed, frost depth, plan sets and height limit", text:
